<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>RETRO GOLF 3D</title>
<style>
html,body{margin:0;padding:0;background:#0b1226;height:100%;overflow:hidden;touch-action:none;-webkit-user-select:none;-moz-user-select:none;-ms-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;box-sizing:border-box;
  /* V1.6: keep the game clear of phone notches and rounded corners */
  padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
/* V1.6: phones held upright get a "turn sideways" message (the game is too small to play that way) */
#rot{display:none;position:fixed;inset:0;z-index:40;background:#0b1226;color:#ffd23f;font:bold 18px 'Segoe UI',Roboto,Arial,sans-serif;text-align:center;align-items:center;justify-content:center;flex-direction:column;gap:18px}
#rot i{display:block;width:34px;height:58px;border:4px solid #fff;border-radius:7px;animation:rotph 2s ease-in-out infinite}
@keyframes rotph{0%,30%{transform:rotate(0)}60%,100%{transform:rotate(-90deg)}}
@media (orientation:portrait) and (max-width:600px){#rot{display:flex}}
#game{image-rendering:pixelated;image-rendering:crisp-edges;display:block;touch-action:none;background:#0b1226;outline:none}
#err{display:none;position:fixed;inset:0;background:rgba(5,10,25,.82);z-index:50;align-items:center;justify-content:center}
#ebox{background:#14213d;border:4px solid #e04040;padding:16px;width:min(460px,90vw);color:#fff;font:bold 16px 'Segoe UI',Roboto,Arial,sans-serif;box-shadow:0 6px 0 #000;text-align:center}
#ebox h3{margin:0 0 8px;color:#ffd23f;font:bold 20px 'Segoe UI',Roboto,Arial,sans-serif}
#ebox p{margin:6px 0 14px;font-size:13px;color:#cfd6e6}
#ebox .row{display:flex;gap:10px}
#ebox button{flex:1;font:bold 16px 'Segoe UI',Roboto,Arial,sans-serif;padding:10px;background:#f2b632;color:#14213d;border:3px solid #000;box-shadow:0 4px 0 #000;cursor:pointer}
#ebox button.g{background:#8892a6}
#errtxt{display:none;text-align:left;max-height:30vh;overflow:auto;margin:12px 0 0;font:11px 'Segoe UI',Roboto,Arial,sans-serif;color:#ffb0b0;white-space:pre-wrap;word-break:break-all}
#modal{display:none;position:fixed;inset:0;background:rgba(5,10,25,.82);z-index:40;align-items:center;justify-content:center}
#mbox{background:#14213d;border:4px solid #f2b632;padding:16px;width:min(560px,90vw);color:#fff;font:bold 16px 'Segoe UI',Roboto,Arial,sans-serif;box-shadow:0 6px 0 #000}
#mbox h3{margin:0 0 10px;color:#f2b632;font:bold 20px 'Segoe UI',Roboto,Arial,sans-serif}
#mbox input,#mbox textarea{width:100%;box-sizing:border-box;font:bold 18px 'Segoe UI',Roboto,Arial,sans-serif;padding:8px;border:3px solid #f2b632;background:#0b1226;color:#fff;text-transform:uppercase}
#mbox textarea{height:120px;font-size:12px;text-transform:none;word-break:break-all}
#mbox .row{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}
#mbox button{flex:1;font:bold 18px 'Segoe UI',Roboto,Arial,sans-serif;padding:10px;background:#f2b632;color:#14213d;border:3px solid #000;box-shadow:0 4px 0 #000;cursor:pointer;min-width:100px}
#mbox button.g{background:#8892a6}
#mbox p{margin:6px 0;font-size:13px;color:#cfd6e6}
</style></head><body>
<div id="wrap"><canvas id="game" width="384" height="216" tabindex="0"></canvas></div>
<div id="rot"><i></i>TURN YOUR PHONE SIDEWAYS<br>TO PLAY</div>
<div id="modal"><div id="mbox"></div></div>
<div id="err"><div id="ebox"><h3>OOPS! SOMETHING WENT WRONG</h3><p>SORRY ABOUT THAT. YOUR CAREER SAVES AFTER EVERY HOLE.</p><div class="row"><button id="errgo">KEEP PLAYING</button><button class="g" id="errmenu">MAIN MENU</button></div><pre id="errtxt"></pre></div></div>
<script>
// ======== r3d/core.js ========
'use strict';
// ============ RETRO GOLF 3D: engine core (WebGL2, no libraries) ============
// World axes: X = the 2D game's x, Z = the 2D game's y, Y = up (metres). Seen from above this is exactly the 2D map.
// Everything here is drawing only. The rules, the ball physics and the holes are the 2D game's own code (src/retro.js).
//
// How a frame is made: (1) the solid things are drawn from the sun's side into a shadow map, (2) the scene is drawn into a
// bright-range picture with real light maths (colours are turned from screen values into light values first),
// (3) the brightest parts are blurred and added back as glow, (4) the result is squeezed back into screen colours
// (a film-like curve), and (5) the menus / HUD canvas is laid on top.

// ---------- small vector helpers on plain [x,y,z] arrays ----------
const V3={
  add:(a,b)=>[a[0]+b[0],a[1]+b[1],a[2]+b[2]],
  sub:(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]],
  mul:(a,s)=>[a[0]*s,a[1]*s,a[2]*s],
  dot:(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2],
  cross:(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]],
  len:a=>Math.hypot(a[0],a[1],a[2]),
  norm:a=>{const l=Math.hypot(a[0],a[1],a[2])||1;return [a[0]/l,a[1]/l,a[2]/l];},
  lerp:(a,b,t)=>[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t]
};
// ---------- 4x4 matrices (Float32Array, column-major like WebGL). All functions return a new matrix. ----------
const M4={
  ident(){const o=new Float32Array(16);o[0]=o[5]=o[10]=o[15]=1;return o;},
  // a*b : b is applied first, then a
  mul(a,b){const o=new Float32Array(16);for(let c=0;c<4;c++){const b0=b[c*4],b1=b[c*4+1],b2=b[c*4+2],b3=b[c*4+3];
    o[c*4]=a[0]*b0+a[4]*b1+a[8]*b2+a[12]*b3;o[c*4+1]=a[1]*b0+a[5]*b1+a[9]*b2+a[13]*b3;o[c*4+2]=a[2]*b0+a[6]*b1+a[10]*b2+a[14]*b3;o[c*4+3]=a[3]*b0+a[7]*b1+a[11]*b2+a[15]*b3;}return o;},
  // chain(A,B,C) = A*B*C (C is applied to the mesh first)
  chain(){let m=arguments[0];for(let i=1;i<arguments.length;i++)m=M4.mul(m,arguments[i]);return m;},
  t(x,y,z){const o=M4.ident();o[12]=x;o[13]=y;o[14]=z;return o;},
  s(x,y,z){const o=M4.ident();o[0]=x;o[5]=y===undefined?x:y;o[10]=z===undefined?x:z;return o;},
  rx(a){const o=M4.ident(),c=Math.cos(a),s=Math.sin(a);o[5]=c;o[6]=s;o[9]=-s;o[10]=c;return o;},
  ry(a){const o=M4.ident(),c=Math.cos(a),s=Math.sin(a);o[0]=c;o[2]=-s;o[8]=s;o[10]=c;return o;},
  rz(a){const o=M4.ident(),c=Math.cos(a),s=Math.sin(a);o[0]=c;o[1]=s;o[4]=-s;o[5]=c;return o;},
  // translate * rotY * rotX * rotZ * scale
  trs(x,y,z,rx,ry,rz,sx,sy,sz){let m=M4.t(x,y,z);if(ry)m=M4.mul(m,M4.ry(ry));if(rx)m=M4.mul(m,M4.rx(rx));if(rz)m=M4.mul(m,M4.rz(rz));
    if(sx!==undefined&&(sx!==1||sy!==undefined))m=M4.mul(m,M4.s(sx,sy===undefined?sx:sy,sz===undefined?sx:sz));return m;},
  ortho(l,r,b,t,n,f){const o=new Float32Array(16);o[0]=2/(r-l);o[5]=2/(t-b);o[10]=-2/(f-n);o[12]=-(r+l)/(r-l);o[13]=-(t+b)/(t-b);o[14]=-(f+n)/(f-n);o[15]=1;return o;},
  persp(fovy,asp,n,f){const o=new Float32Array(16),t=1/Math.tan(fovy/2);o[0]=t/asp;o[5]=t;o[10]=(f+n)/(n-f);o[11]=-1;o[14]=2*f*n/(n-f);return o;},
  lookAt(e,c,u){const z=V3.norm(V3.sub(e,c)),x=V3.norm(V3.cross(u,z)),y=V3.cross(z,x),o=new Float32Array(16);
    o[0]=x[0];o[4]=x[1];o[8]=x[2];o[1]=y[0];o[5]=y[1];o[9]=y[2];o[2]=z[0];o[6]=z[1];o[10]=z[2];
    o[12]=-V3.dot(x,e);o[13]=-V3.dot(y,e);o[14]=-V3.dot(z,e);o[15]=1;return o;},
  // a matrix whose columns are the given axes, sitting at point o
  basis(o,x,y,z){const m=new Float32Array(16);m[0]=x[0];m[1]=x[1];m[2]=x[2];m[4]=y[0];m[5]=y[1];m[6]=y[2];m[8]=z[0];m[9]=z[1];m[10]=z[2];m[12]=o[0];m[13]=o[1];m[14]=o[2];m[15]=1;return m;},
  // maps the unit Y axis onto the line a -> b (for limbs, sticks, clubs). X and Z stay 1 unit long. hint = a rough "forward" direction.
  seg(a,b,hint){const y=V3.sub(b,a),yn=V3.norm(y);let h=hint||[0,0,1];if(Math.abs(V3.dot(yn,V3.norm(h)))>0.98)h=[1,0,0];
    const x=V3.norm(V3.cross(yn,h)),z=V3.cross(x,yn);return M4.basis(a,x,y,z);},
  pt(m,p){return [m[0]*p[0]+m[4]*p[1]+m[8]*p[2]+m[12],m[1]*p[0]+m[5]*p[1]+m[9]*p[2]+m[13],m[2]*p[0]+m[6]*p[1]+m[10]*p[2]+m[14]];},
  dir(m,d){return [m[0]*d[0]+m[4]*d[1]+m[8]*d[2],m[1]*d[0]+m[5]*d[1]+m[9]*d[2],m[2]*d[0]+m[6]*d[1]+m[10]*d[2]];},
  inv(m){const o=new Float32Array(16),
    a00=m[0],a01=m[1],a02=m[2],a03=m[3],a10=m[4],a11=m[5],a12=m[6],a13=m[7],a20=m[8],a21=m[9],a22=m[10],a23=m[11],a30=m[12],a31=m[13],a32=m[14],a33=m[15],
    b00=a00*a11-a01*a10,b01=a00*a12-a02*a10,b02=a00*a13-a03*a10,b03=a01*a12-a02*a11,b04=a01*a13-a03*a11,b05=a02*a13-a03*a12,
    b06=a20*a31-a21*a30,b07=a20*a32-a22*a30,b08=a20*a33-a23*a30,b09=a21*a32-a22*a31,b10=a21*a33-a23*a31,b11=a22*a33-a23*a32;
    let d=b00*b11-b01*b10+b02*b09+b03*b08-b04*b07+b05*b06;if(!d)return M4.ident();d=1/d;
    o[0]=(a11*b11-a12*b10+a13*b09)*d;o[1]=(a02*b10-a01*b11-a03*b09)*d;o[2]=(a31*b05-a32*b04+a33*b03)*d;o[3]=(a22*b04-a21*b05-a23*b03)*d;
    o[4]=(a12*b08-a10*b11-a13*b07)*d;o[5]=(a00*b11-a02*b08+a03*b07)*d;o[6]=(a32*b02-a30*b05-a33*b01)*d;o[7]=(a20*b05-a22*b02+a23*b01)*d;
    o[8]=(a10*b10-a11*b08+a13*b06)*d;o[9]=(a01*b08-a00*b10-a03*b06)*d;o[10]=(a30*b04-a31*b02+a33*b00)*d;o[11]=(a21*b02-a20*b04-a23*b00)*d;
    o[12]=(a11*b07-a10*b09-a12*b06)*d;o[13]=(a00*b09-a01*b07+a02*b06)*d;o[14]=(a31*b01-a30*b03-a32*b00)*d;o[15]=(a20*b03-a21*b01+a22*b00)*d;return o;}
};
// ---------- colours ----------
// col('#rrggbb') or col([r,g,b] 0..255) -> [r,g,b] 0..1 (screen values; the shaders turn them into light values).
const colCache=new Map();
function col(c){
  if(typeof c!=='string')return [c[0]/255,c[1]/255,c[2]/255];
  let v=colCache.get(c);if(v)return v;
  let s=c[0]==='#'?c.slice(1):c;if(s.length===3)s=s[0]+s[0]+s[1]+s[1]+s[2]+s[2];
  const n=parseInt(s.slice(0,6),16)||0;v=[((n>>16)&255)/255,((n>>8)&255)/255,(n&255)/255];colCache.set(c,v);return v;
}
function shade(c,f){const v=typeof c==='string'||c[0]>1||c[1]>1||c[2]>1?col(c):c;return [Math.min(1,v[0]*f),Math.min(1,v[1]*f),Math.min(1,v[2]*f)];}
function rng32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}

// ---------- mesh builder ----------
// Collects triangles (position, normal, colour, sway) and uploads them once with build(). Colours are [r,g,b] 0..1 (use col()).
// this.w = how much the following vertices sway in the wind (0 = rigid; leaves about 0.05..0.35). Anything that sways is lit as leaves.
const ICO=(()=>{ // unit icosphere at detail 0..3: {v:[[x,y,z]..], f:[[a,b,c]..]}
  const t=(1+Math.sqrt(5))/2,base=[[-1,t,0],[1,t,0],[-1,-t,0],[1,-t,0],[0,-1,t],[0,1,t],[0,-1,-t],[0,1,-t],[t,0,-1],[t,0,1],[-t,0,-1],[-t,0,1]].map(V3.norm);
  const f0=[[0,11,5],[0,5,1],[0,1,7],[0,7,10],[0,10,11],[1,5,9],[5,11,4],[11,10,2],[10,7,6],[7,1,8],[3,9,4],[3,4,2],[3,2,6],[3,6,8],[3,8,9],[4,9,5],[2,4,11],[6,2,10],[8,6,7],[9,8,1]];
  const out=[{v:base,f:f0}];
  for(let d=1;d<=3;d++){const p=out[d-1],v=p.v.slice(),f=[],mid=new Map();
    const m=(a,b)=>{const k=a<b?a+'_'+b:b+'_'+a;let i=mid.get(k);if(i===undefined){i=v.length;v.push(V3.norm(V3.add(v[a],v[b])));mid.set(k,i);}return i;};
    for(const [a,b,c] of p.f){const ab=m(a,b),bc=m(b,c),ca=m(c,a);f.push([a,ab,ca],[b,bc,ab],[c,ca,bc],[ab,bc,ca]);}
    out.push({v,f});}
  return out;
})();
class MB{
  constructor(){this.v=[];this.i=[];this.n=0;this.w=0;}
  vx(p,nm,c){this.v.push(p[0],p[1],p[2],nm[0],nm[1],nm[2],c[0],c[1],c[2],this.w);return this.n++;}
  // flat-shaded triangle and quad (corners anticlockwise seen from outside)
  tri(a,b,c,cl){const nm=V3.norm(V3.cross(V3.sub(b,a),V3.sub(c,a)));const i=this.vx(a,nm,cl);this.vx(b,nm,cl);this.vx(c,nm,cl);this.i.push(i,i+1,i+2);}
  quad(a,b,c,d,cl){const nm=V3.norm(V3.cross(V3.sub(b,a),V3.sub(d,a)));const i=this.vx(a,nm,cl);this.vx(b,nm,cl);this.vx(c,nm,cl);this.vx(d,nm,cl);this.i.push(i,i+1,i+2,i,i+2,i+3);}
  // box of size sx,sy,sz centred on the origin of matrix m.  cl = colour, or {top,bottom,side} colours
  box(m,sx,sy,sz,cl){const hx=sx/2,hy=sy/2,hz=sz/2,P=(x,y,z)=>M4.pt(m,[x,y,z]);
    const a=P(-hx,-hy,-hz),b=P(hx,-hy,-hz),c=P(hx,-hy,hz),d=P(-hx,-hy,hz),e=P(-hx,hy,-hz),f=P(hx,hy,-hz),g=P(hx,hy,hz),h=P(-hx,hy,hz);
    const S=cl.side||cl,T=cl.top||S,B=cl.bottom||S;
    this.quad(h,g,f,e,T);this.quad(a,b,c,d,B);this.quad(d,c,g,h,S);this.quad(b,a,e,f,S);this.quad(c,b,f,g,S);this.quad(a,d,h,e,S);}
  // box whose bottom centre sits on the origin of m (handy for things standing on the ground)
  boxUp(m,sx,sy,sz,cl){this.box(M4.mul(m,M4.t(0,sy/2,0)),sx,sy,sz,cl);}
  // tapered cylinder along +Y of m: radius r0 at y=0, r1 at y=h. seg sides. smooth = rounded shading. caps: 0 none, 1 top, 2 bottom, 3 both
  cyl(m,r0,r1,h,seg,cl,caps,smooth){
    seg=seg||8;caps=caps===undefined?3:caps;const ring=[],top=[];
    for(let k=0;k<seg;k++){const a=k/seg*Math.PI*2,c=Math.cos(a),s=Math.sin(a);ring.push(M4.pt(m,[c*r0,0,s*r0]));top.push(M4.pt(m,[c*r1,h,s*r1]));}
    if(smooth!==false){const sl=(r0-r1)/(h||1),i0=this.n;
      for(let k=0;k<seg;k++){const a=k/seg*Math.PI*2,nm=V3.norm(M4.dir(m,[Math.cos(a),sl,Math.sin(a)]));this.vx(ring[k],nm,cl);this.vx(top[k],nm,cl);}
      for(let k=0;k<seg;k++){const a=i0+k*2,b=i0+((k+1)%seg)*2;this.i.push(a,a+1,b+1,a,b+1,b);}
    } else for(let k=0;k<seg;k++){const k2=(k+1)%seg;this.quad(ring[k],top[k],top[k2],ring[k2],cl);}
    if((caps&1)&&r1>1e-4){const c=M4.pt(m,[0,h,0]);for(let k=0;k<seg;k++)this.tri(c,top[(k+1)%seg],top[k],cl);}
    if((caps&2)&&r0>1e-4){const c=M4.pt(m,[0,0,0]);for(let k=0;k<seg;k++)this.tri(c,ring[k],ring[(k+1)%seg],cl);}
  }
  // ball / blob centred on the origin of m with radii rx,ry,rz. det 0..3 (20, 80, 320, 1280 faces). flat = faceted low-poly shading.
  // jit = lumpiness 0..0.5 (each corner pushed in or out at random, from seed). cl2 (optional) = colour for the lit top half (blended by height).
  ball(m,rx,ry,rz,det,cl,flat,jit,seed,cl2){
    const I=ICO[det|0],r=rng32((seed||1)*7919+13),pts=I.v.map(v=>{const k=1+(jit?(r()-0.5)*2*jit:0);return M4.pt(m,[v[0]*rx*k,v[1]*ry*k,v[2]*rz*k]);});
    const cAt=v=>{if(!cl2)return cl;const t=Math.max(0,Math.min(1,v[1]*0.75+0.5));return [cl[0]+(cl2[0]-cl[0])*t,cl[1]+(cl2[1]-cl[1])*t,cl[2]+(cl2[2]-cl[2])*t];};
    if(this.leafy&&this.w>0){ // a tree's leaves (this.leafy = how fine): a smooth, lumpy cloud shape. The shader adds the leaf speckle and the ragged edge.
      const I2=ICO[Math.max(det|0,this.leafy)],J=Math.max(jit||0,0.1),a1=r()*6.28,a2=r()*6.28,a3=r()*6.28,nr=[];
      const P2=I2.v.map(v=>{const k=1+J*0.6*(Math.sin(v[0]*3.1+v[1]*1.7+a1)+Math.sin(v[1]*3.7+v[2]*2.3+a2)+Math.sin(v[2]*4.3+v[0]*2.9+a3));nr.push([0,0,0]);return M4.pt(m,[v[0]*rx*k,v[1]*ry*k,v[2]*rz*k]);});
      for(const [a,b,c] of I2.f){const n=V3.cross(V3.sub(P2[b],P2[a]),V3.sub(P2[c],P2[a]));for(const k of [a,b,c]){nr[k][0]+=n[0];nr[k][1]+=n[1];nr[k][2]+=n[2];}}
      const i0=this.n;I2.v.forEach((v,k)=>this.vx(P2[k],V3.norm(nr[k]),cAt(v)));for(const [a,b,c] of I2.f)this.i.push(i0+a,i0+b,i0+c);return;}
    if(flat){for(const [a,b,c] of I.f){const nm=V3.norm(V3.cross(V3.sub(pts[b],pts[a]),V3.sub(pts[c],pts[a])));const cc=cAt(V3.mul(V3.add(V3.add(I.v[a],I.v[b]),I.v[c]),1/3));
      const i=this.vx(pts[a],nm,cc);this.vx(pts[b],nm,cc);this.vx(pts[c],nm,cc);this.i.push(i,i+1,i+2);}return;}
    const i0=this.n;I.v.forEach((v,k)=>this.vx(pts[k],V3.norm(M4.dir(m,[v[0]/rx,v[1]/ry,v[2]/rz])),cAt(v)));
    for(const [a,b,c] of I.f)this.i.push(i0+a,i0+b,i0+c);
  }
  // flat disc on the XZ plane of m (facing +Y)
  disc(m,r,seg,cl){const c=M4.pt(m,[0,0,0]);seg=seg||12;for(let k=0;k<seg;k++){const a=k/seg*6.2832,b=(k+1)/seg*6.2832;this.tri(c,M4.pt(m,[Math.cos(b)*r,0,Math.sin(b)*r]),M4.pt(m,[Math.cos(a)*r,0,Math.sin(a)*r]),cl);}}

  // sizes used when a tree arrives with a number missing
  const DEF={gum:{r:3.7,h:11,hb:3,tr:0.35},oak:{r:4.5,h:11,hb:2.4,tr:0.5},pine:{r:3.4,h:12,hb:1.8,tr:0.35},snowpine:{r:3.4,h:12,hb:1.8,tr:0.35},
    gorse:{r:1.7,h:1.3,hb:0,tr:0.35},palm:{r:3,h:10,hb:5.5,tr:0.3},cactus:{r:0.55,h:3.2,hb:0,tr:0.45},bumper:{r:1.4,h:3,hb:0,tr:1.4},
    rock:{r:1.6,h:2.4,hb:0,tr:1.5},maple:{r:0.55,h:3.2,hb:0,tr:0.45}};
  const BARK=col('#5a3e24'),BARKD=col('#3e2a18'),WARM=[1,0.9,0.52];
  const windTop=h=>0.35*clamp(h/12,0.3,1.1); // sway at the very top: a big tree moves about 0.35 m, a small one less

  const BUILD={
    // big round dark-green tree: a crown and three heavy lobes on a brown trunk
    oak(mb,o,rnd){
      const P=PAL('oak'),x=o.x,y=o.y,z=o.z,r=o.r,h=o.h,hb=o.hb,tr=o.tr,s=h-hb;
      const lx=(rnd()-0.5)*0.4,lz=(rnd()-0.5)*0.4;
      tube(mb,[{p:[x,y-0.3,z],r:tr*1.45,c:BARKD},{p:[x,y+0.45,z],r:tr*1.04,c:BARK},{p:[x+lx*0.5,y+hb,z+lz*0.5],r:tr*0.9,c:BARK},{p:[x+lx,y+hb+s*0.4,z+lz],r:tr*0.5,c:BARKD}],7);

    // Australian gum: pale forked trunk, three loose olive leaf clumps with air between them
    gum(mb,o,rnd){
      const P=PAL('gum'),x=o.x,y=o.y,z=o.z,r=o.r,h=o.h,hb=o.hb,tr=o.tr,s=h-hb,wt=windTop(h);
      const pale=col('#e6e0d0'),paleS=col('#bdb6a4');
      const la=o.ph,L=0.25+rnd()*0.5,fk=[x+Math.cos(la)*L,y+hb*0.86,z+Math.sin(la)*L];
      tube(mb,[{p:[x,y-0.3,z],r:tr*1.3,c:paleS},{p:[x+Math.cos(la)*L*0.35,y+hb*0.42,z+Math.sin(la)*L*0.35],r:tr,c:pale},{p:fk,r:tr*0.8,c:pale,w:0.01}],6);
      const cen=[],br=0.93+o.v*0.14;
      for(let k=0;k<3;k++){ // one limb to each clump
        const a=o.ph+1+k*2.09+(rnd()-0.5)*0.6,d=r*(0.34+rnd()*0.08),c=[x+Math.cos(a)*d,y+hb+s*[0.3,0.54,0.79][k],z+Math.sin(a)*d];
        const md=[fk[0]+(c[0]-fk[0])*0.62,fk[1]+(c[1]-fk[1])*0.5,fk[2]+(c[2]-fk[2])*0.62];
        tube(mb,[{p:fk,r:tr*0.6,c:pale,w:0.01},{p:md,r:tr*0.42,c:pale,w:wt*0.2},{p:c,r:tr*0.2,c:paleS,w:wt*(0.3+k*0.25)}],5);
        cen.push(c);
      }
      const n0=mb.n;
      for(let k=0;k<3;k++){
        const c=cen[k],rr=r*(0.56+rnd()*0.06);
        mb.ball(M4.trs(c[0],c[1],c[2],(rnd()-0.5)*0.3,rnd()*TAU,(rnd()-0.5)*0.3),rr,s*(0.2+rnd()*0.04),rr*(0.85+rnd()*0.2),1,mul(k===0?P[0]:mix(P[0],P[1],0.6),br),true,0.22,seedOf(rnd),mul(k===2?mix(P[3],WARM,0.1):P[2],br));
      }
      {const c=cen[2],a=o.ph+4;mb.ball(M4.trs(c[0]+Math.cos(a)*r*0.3,c[1]+s*0.1,c[2]+Math.sin(a)*r*0.3,0,rnd()*TAU),r*0.3,s*0.11,r*0.3,0,mul(P[2],br),true,0.2,seedOf(rnd),mul(P[3],br));}
      fit(mb,n0,x,z,r,y+h);swayUp(mb,n0,y+hb,y+h,0.1,wt);
    },
    // tall cone of stacked skirts; snow = white on every skirt and a white top
    pine(mb,o,rnd,snow){
      const P=PAL(snow?'snowpine':'pine'),x=o.x,y=o.y,z=o.z,r=o.r,h=o.h,hb=o.hb,tr=o.tr,s=h-hb;
      tube(mb,[{p:[x,y-0.3,z],r:tr*1.3,c:BARKD},{p:[x,y+hb+s*0.14,z],r:tr*0.72,c:BARK}],6);

        const f=i/nT,yb=y+hb+s*f*0.93,top=i===nT-1?y+h:yb+s/nT*1.6,th=top-yb,R=r*(1-0.76*f),rot=o.ph+i*0.9+rnd();

    // low round bush with yellow flowers
    gorse(mb,o,rnd){

    // tall curved ringed trunk, seven drooping fronds, a coconut or two
    palm(mb,o,rnd){
      const P=PAL('palm'),x=o.x,y=o.y,z=o.z,r=o.r,h=o.h,hb=o.hb,tr=o.tr,wt=windTop(h);

      const at=u=>{const b=bow*4*u*(1-u)+0.15*u*u;return [x+cx*b,y+yc*u-(u===0?0.3:0),z+cz*b];}; // bows out, comes back over its own foot
      const nS=8;

      for(let k=0,nc=(o.v*3)|0;k<nc;k++){const a=o.ph+2+k*2.4;mb.ball(M4.t(cp[0]+Math.cos(a)*0.3,cp[1]-0.26,cp[2]+Math.sin(a)*0.3),0.17,0.18,0.17,0,col('#4a3018'),false,0,1,col('#7a5a30'));}

        const a2=2*Mm+2*Math.sqrt(Mm*(Mm+D)),b2=a2+D,S=[],Lf=[],Rt=[]; // height along the frond = a2*u - b2*u*u: up by Mm, then down to D below the crown

          S.push(sp);Lf.push([sp[0]+sx*hw,sp[1]-hw*0.55,sp[2]+sz*hw]);Rt.push([sp[0]-sx*hw,sp[1]-hw*0.55,sp[2]-sz*hw]);

        for(let j=0;j<2;j++){

      }

    },
    // saguaro: ribbed green column with two arms
    cactus(mb,o,rnd){
      const x=o.x,y=o.y,z=o.z,h=o.h,g=col('#2f7a3a'),gl=col('#4fa058'),gd=col('#235c2c'),Rc=clamp(o.tr*0.7,0.16,0.6);

    bumper(mb,o){

      lathe(mb,M4.trs(o.x,o.y,o.z,0,o.ph),[[r*0.97,-0.25,pk],[r*0.97,h*0.15,dk],[r*0.6,h*0.22,wh],[r*0.6,h*0.6,dk],[r,h*0.68,lp],[r,h*0.8,wh],[r*0.68,h*0.91,pk],[r*0.34,h*0.975,lp],[0,h,lp]],9,{band:true});
    },
    // boulder with a pebble or two at its foot (alpine: snow on top; volcano: black basalt)
    rock(mb,o,rnd){
      const P=PAL('rock'),x=o.x,y=o.y,z=o.z,r=o.r,h=o.h,n0=mb.n;
      let lo=P[1],hi=P[3],lo2=P[0],hi2=P[2];

  // very cheap stand-ins (12 triangles at most) for the trees and rocks beyond the edge of the hole
  function farTree(mb,kind,x,y,z,rnd){
    const sc=0.8+rnd()*0.5,j=0.85+rnd()*0.3,pick=rnd(),m=M4.trs(x,y-1,z,0,rnd()*TAU); // stands 1 m into the ground so it never floats
    if(kind==='pine'||kind==='snowpine'){
      const P=PAL(kind),R=3.3*sc,h=12*sc;
      lathe(mb,m,[[R,1.2,mul(P[1],j)],[0,1+h*0.62]],5,{flat:true});
      lathe(mb,M4.mul(m,M4.ry(0.6)),[[R*0.7,1+h*0.4,kind==='snowpine'?P[2]:mul(P[2],j)],[0,1+h]],5,{flat:true});
    }else if(kind==='gorse'){
      const P=PAL('gorse');octa(mb,M4.mul(m,M4.t(0,1.3,0)),1.9*sc,1.1,1.7*sc,mul(P[0],j),mul(P[2],j));
    }else if(kind==='palm'){
      const P=PAL('palm'),h=9.5*sc,c=M4.pt(m,[0.4,1+h,0]);
      lathe(mb,m,[[0.3,0,col('#9a7a48')],[0,1+h+0.2]],3,{flat:true});
      for(let k=0;k<4;k++){const a=k*PI/2+0.4,d=[Math.cos(a),Math.sin(a)],tip=[c[0]+d[0]*3.2*sc,c[1]-1.4*sc,c[2]+d[1]*3.2*sc],s=0.7*sc;
        const l=[c[0]-d[1]*s,c[1]+0.3,c[2]+d[0]*s],r=[c[0]+d[1]*s,c[1]+0.3,c[2]-d[0]*s];
        mb.tri(l,tip,r,mul(P[2],j));mb.tri(l,r,tip,mul(P[0],j));}
    }else if(kind==='cactus'){
      const g=mul(col('#2f7a3a'),j),h=3.6*sc;
      lathe(mb,m,[[0.36,0,g],[0.33,1+h-0.4,g],[0,1+h,col('#4fa058')]],3,{flat:true});
      lathe(mb,M4.mul(m,M4.t(0.5,1+h*0.42,0)),[[0.17,0,g],[0,1.2*sc,g]],3,{flat:true});
    }else if(kind==='bumper'){
      const P=PAL('bumper');lathe(mb,m,[[1.1*sc,0,pick<0.5?P[1]:col('#40c8e8')],[1.1*sc,3.2,P[3]],[0,4.1,P[2]]],4,{flat:true});
    }else if(kind==='rock'){
      const P=PAL('rock'),R=(1.4+pick*2)*sc;octa(mb,M4.chain(m,M4.t(0,1+R*0.3,0),M4.rz(0.3)),R*1.15,R*0.8,R*0.9,mul(P[0],j),mul(P[2],j));
    }else{ // gum, oak, maple and anything else: a blob on a stick
      const g=kind==='gum',mp=kind==='maple',P=PAL(g?'gum':mp?'maple':'oak'),h=(g?10:mp?7:9)*sc,R=(g?3.3:mp?2.6:4)*sc;
      const lo=mp?P[pick<0.5?0:1]:P[0],hi=mp?P[pick<0.33?1:pick<0.66?2:3]:P[2];
      lathe(mb,m,[[g?0.3:0.42,0,g?col('#d8d2c0'):BARK],[0,1+h*0.7]],3,{flat:true});
      octa(mb,M4.mul(m,M4.t(0,1+h-R*0.75,0)),R,R*0.78,R*0.9,mul(lo,j),mul(hi,j));
    }

  // ---------------------------------------------------------------- far backdrop ----------------------------------------------------------------
  function backdropBuild(mb,course,box){
    const id=typeof course.id==='string'?course.id:'bush',pal=course.pal&&typeof course.pal==='object'?course.pal:{};
    let x0=fin(box.x0,-150),x1=fin(box.x1,150),z0=fin(box.z0,-150),z1=fin(box.z1,150);
    if(x1<x0){const t=x0;x0=x1;x1=t;}if(z1<z0){const t=z0;z0=z1;z1=t;}
    if(x1-x0<10){x0-=50;x1+=50;}if(z1-z0<10){z0-=50;z1+=50;}
    const by=fin(box.y,0),A=x1-x0,B=z1-z0;
    const hgt=typeof box.gy==='function'?box.gy:null,seaFn=typeof box.seaAt==='function'?box.seaAt:null,seaSide=box.sea&&typeof box.sea==='object'?box.sea:null;
    let sd=0;for(let i=0;i<id.length;i++)sd=(sd*31+id.charCodeAt(i))|0;
    const rnd=rng32(sd^Math.round(x0*3+x1*5+z0*7+z1*11));
    const PC=(k,d)=>rgb(pal[k],d);
    const oob=PC('oob',[0.3,0.4,0.2]),deep=PC('deep',[0.33,0.48,0.2]),rough=PC('rough',[0.38,0.55,0.22]),sand=PC('sand',[0.92,0.84,0.63]),beach=PC('beach',sand);
    // A point on the outline that runs D metres outside the box; s = 0..1 goes once around. -> [x, z, outward x, outward z]
    // (the corners are rounded; s means the same direction from the hole whatever D is)
    const QR=PI*150,PER=2*A+2*B+4*QR;
    const ring=(s,D)=>{
      s-=Math.floor(s);let d=s*PER,a;
      if(d<A)return [x0+d,z0-D,0,-1];d-=A;
      if(d<QR){a=-PI/2+d/QR*PI/2;return [x1+Math.cos(a)*D,z0+Math.sin(a)*D,Math.cos(a),Math.sin(a)];}d-=QR;
      if(d<B)return [x1+D,z0+d,1,0];d-=B;
      if(d<QR){a=d/QR*PI/2;return [x1+Math.cos(a)*D,z1+Math.sin(a)*D,Math.cos(a),Math.sin(a)];}d-=QR;
      if(d<A)return [x1-d,z1+D,0,1];d-=A;
      if(d<QR){a=PI/2+d/QR*PI/2;return [x0+Math.cos(a)*D,z1+Math.sin(a)*D,Math.cos(a),Math.sin(a)];}d-=QR;
      if(d<B)return [x0-D,z1-d,-1,0];d-=B;
      a=PI+Math.min(1,d/QR)*PI/2;return [x0+Math.cos(a)*D,z0+Math.sin(a)*D,Math.cos(a),Math.sin(a)];
    };
    // is the edge of the hole sea here?  box.sea = {x0,x1,z0,z1: true} names whole sides; box.seaAt(x,z) asks about one spot
    const isSea=s=>{
      const p=ring(s,0);
      if(seaSide&&((p[2]>0.5&&seaSide.x1)||(p[2]<-0.5&&seaSide.x0)||(p[3]>0.5&&seaSide.z1)||(p[3]<-0.5&&seaSide.z0)))return true;
      if(seaFn){try{return !!seaFn(p[0]-p[2]*3,p[1]-p[3]*3);}catch(e){return false;}}
      return false;
    };
    const ground=(x,z)=>{if(hgt){try{return fin(hgt(x,z),by);}catch(e){}}return by;};
    // every far triangle faces the hole: nothing out there is ever seen from behind
    const ctr=[(x0+x1)/2,by+60,(z0+z1)/2];
    const tri=(a,b,c,cl)=>{const n=V3.cross(V3.sub(b,a),V3.sub(c,a));if(V3.dot(n,V3.sub(ctr,a))<0)mb.tri(a,c,b,cl);else mb.tri(a,b,c,cl);};
    const wave=f=>{const p1=rnd()*TAU,p2=rnd()*TAU,p3=rnd()*TAU;return s=>0.5+0.5*(0.55*Math.sin(s*TAU*f[0]+p1)+0.3*Math.sin(s*TAU*f[1]+p2)+0.15*Math.sin(s*TAU*f[2]+p3));};
    // A range of hills all the way round. c: D = how far out its foot is, depth = how far back the crest stands, N = columns, lo..hi = crest height,
    //   f = three wave counts, jag = roughness, pow > 1 = more valleys, mid = height of the shoulder row (0..1 of the crest),
    //   c0 / c1 = colour below / above the shoulder, alt = {c, p}: some upper faces in another colour, isles = gaps of open ground between the hills
    const ridge=c=>{

    const mound=(s,D,prof,seg,cf,cap,capCol)=>{const p=ring(s,D);lathe(mb,M4.trs(p[0],by,p[1],0,rnd()*TAU),prof,seg,{flat:true,cf,cap:cap||0,capCol});};
    const landS=()=>{for(let t=0;t<12;t++){const s=rnd();if(!isSea(s)||t===11)return s;}return 0;}; // a random place round the ring, on land when there is any
    const shadeF=(c,k)=>mul(c,0.86+0.24*frac(k*0.618+0.3)); // each facet its own brightness, the same every build

    const N1=46,N2=50;
    if(id==='links'){ // low dunes

      ridge({D:480,depth:110,N:N2,lo:26,hi:46,f:[3,7,13],jag:0.1,mid:0.5,c0:mul(mix(rough,[0.4,0.46,0.34],0.5),0.8),c1:mul(mix(rough,sand,0.3),0.8)});
    }else if(id==='desert'){ // dunes, then red flat-topped mesas

      ridge({D:500,depth:120,N:N2-10,lo:30,hi:58,f:[2,5,11],jag:0.15,mid:0.5,c0:[0.52,0.29,0.19],c1:[0.64,0.37,0.23]});

  function init(){

// ============ RETRO GOLF 3D: people (the golfer, rivals and the crowd) ============
// One smooth body mesh, bent by 14 bones (hips, belly, chest, head, upper arms, forearms, thighs, shins, feet), so elbows,
// knees and shoulders bend without gaps. The head, hair, hats, extras and the club are separate pieces fixed to a bone.
// A pose is first worked out as a few points (where the hips, hands and feet are, which way the chest and head face);
// solve() turns that into bone positions. Golfer3D.draw(M,o) is the golfer; Human.fan(...) is one of the crowd.
//
// The golfer's "shot frame" M: origin = the ball's spot on the ground, +X = towards the target, +Y = up, +Z = to the right
// of the target line. The golfer is right-handed: stands on the -Z side of the ball, faces +Z, target on their left.
const Human=(()=>{

  const add=V3.add,sub=V3.sub,mul=V3.mul,nrm=V3.norm,cross=V3.cross,dot=V3.dot,lerp=V3.lerp;
  // body sizes in metres (1.78 tall). Bind pose = standing, arms hanging a little out from the sides, facing +Z.
  const BELLY=0.22,SPINE=0.50,SHX=0.19,UP=0.29,FORE=0.31,THIGH=0.42,SHIN=0.405,ANK=0.075,HIPX=0.095,REACH=(UP+FORE)*0.985;
  const B={hip:[0,0.93,0],chest:[0,1.15,0],neck:[0,1.465,0],
    LS:[0.19,1.40,0],LE:[0.248,1.116,0],LW:[0.31,0.812,0],RS:[-0.19,1.40,0],RE:[-0.248,1.116,0],RW:[-0.31,0.812,0],
    LH:[0.095,0.90,0],LK:[0.10,0.48,0.004],LA:[0.105,ANK,-0.008],RH:[-0.095,0.90,0],RK:[-0.10,0.48,0.004],RA:[-0.105,ANK,-0.008]};

    while(this.mNext<c.currentTime+0.25){
      const i=this.mStep%64,L=this.SONG.lead[i],B=this.SONG.bass[(i>>1)%32];
      const mf=m=>440*Math.pow(2,(m-69)/12), d=this.mNext-c.currentTime;
      if(L)this.tone(mf(L),sp*0.9,'square',0.5,null,d,this.musicGain);
      if(i%2===0)this.tone(mf(B-12),sp*1.8,'triangle',0.9,null,d,this.musicGain);

        for(let i=0;i<n;i++){l=(l+0.02*(Math.random()*2-1))/1.02;d[i]=l*3.5;}
        const drift=d[n-1]-d[0];for(let i=0;i<n;i++)d[i]-=drift*i/(n-1); // the loop's two ends meet, so it never clicks
        this.brown=b;}

    case 'dots':return (((px*3+py*2)%5+5)%5===0)?c2:((((px+py*3)%7+7)%7===0)?'#ff6060':c1);
    case 'tux':return (px===0||px===-1)?(py===0?'#c02030':c2):c1;

// V2.1: wears hats, hair styles, patterned shirts and pants, things on the back and face extras from the LOCKER
function drawGolfer(x,y,look,pose,phi,time,flip,clubLen){
  x=Math.round(x);y=Math.round(y);
  const F=flip?-1:1;
  const R=(dx,dy,w,h,c)=>{ctx.fillStyle=c;ctx.fillRect(flip?x-dx-w+1:x+dx,y+dy,w,h);};
  const P=(dx,dy,w,h,p,c1,c2)=>{if(!p){R(dx,dy,w,h,c1);return;}for(let j=0;j<h;j++)for(let i=0;i<w;i++)R(dx+i,dy+j,1,1,patCol(p,c1,c2||c1,dx+i,j,time||0));};

  let jump=0,headDown=0;
  if(pose==='celebrate')jump=-Math.round(Math.abs(Math.sin(time*9))*3);
  if(pose==='sad')headDown=1;
  const Y=jump,ty=-11+Y+headDown,hy=-16+Y+headDown*2;
  // older looks (quick rounds, the title screen): CAP and VISOR used to be hair styles
  let hs=look.hairS||'SHORT',hat=look.hat||null,hatC=look.hatC;
  if(hs==='CAP'){hs='SHORT';if(!hat){hat='cap';hatC=look.shirt==='#ffffff'?'#202838':'#ffffff';}}
  else if(hs==='VISOR'){hs='SHORT';if(!hat){hat='visor';hatC='#f2f2f2';}}
  const hc=look.hairC==='RAINBOW'?'hsl('+(((time||0)*120)%360|0)+',90%,60%)':look.hairC;
  drawBackItem(R,look.back,look.backC,ty,time||0);
  // legs
  P(-3,-5+Y,2,5,look.pantsP,look.pants,look.pants2);P(1,-5+Y,2,5,look.pantsP,look.pants,look.pants2);
  R(-4,-1+Y,3,1,'#222');R(1,-1+Y,3,1,'#222');
  // torso
  P(-3,ty,6,6,look.shirtP,look.shirt,look.shirt2);R(-3,ty+5,6,1,'#00000033');
  // head and hair
  R(-2,hy,4,5,look.skin);
  switch(hs){
    case 'SHORT':R(-2,hy-1,4,2,hc);break;
    case 'LONG':R(-3,hy-1,6,2,hc);R(-3,hy,1,5,hc);R(2,hy,1,5,hc);break;
    case 'BALD':R(-2,hy,4,1,look.skin);break;
    case 'SPIKY':R(-2,hy-1,4,2,hc);R(-2,hy-2,1,1,hc);R(0,hy-3,1,2,hc);R(1,hy-2,1,1,hc);break;
    case 'MOHAWK':R(-1,hy-3,2,4,hc);break;
    case 'AFRO':R(-3,hy-3,6,4,hc);R(-4,hy-2,8,3,hc);R(-4,hy+1,1,2,hc);R(3,hy+1,1,2,hc);break;
    case 'MULLET':R(-2,hy-1,4,2,hc);R(-3,hy+1,1,5,hc);R(2,hy+1,1,5,hc);break;
    case 'PONY':R(-2,hy-1,4,2,hc);R(-3,hy,1,1,hc);R(-4,hy+1,1,3,hc);break;
  }
  R(-1,hy+2,1,1,'#222');R(1,hy+2,1,1,'#222');
  drawHat(R,hat,hatC,hy);
  drawFaceItem(R,look.fx,look.fxC,hy,hat,time||0);
  // arms + club
  const sx=x, sy=y-10+Y+headDown;
  if(pose==='celebrate'){
    const a=Math.sin(time*12)>0?1:0;
    pline(sx-3,sy,sx-5,sy-6-a,look.skin);pline(sx+2,sy,sx+4,sy-6-(1-a),look.skin);

  if(pose==='sad'){pline(sx-3,sy,sx-3,sy+5,look.skin);pline(sx+2,sy,sx+2,sy+5,look.skin);return;}
  if(pose==='idle'){pline(sx-3,sy,sx-3,sy+5,look.skin);pline(sx+2,sy,sx+2,sy+5,look.skin);pline(sx+3,sy+5,sx+4,sy+12,'#bbb');return;}
  const ph=(phi||0)*F;
  const hx=sx+Math.sin(ph)*5, hy2=sy+Math.cos(ph)*5;
  pline(sx-3,sy,hx,hy2,look.skin);pline(sx+2,sy,hx,hy2,look.skin);

function fxConfetti(n){for(let i=0;i<n;i++){const L=i%2===0,a=(L?-1.0:-2.14)+(Math.random()-0.5)*1.0,v=230+Math.random()*170;

function updFx(dt){

function dropFromWater(){

    const x=P0.x+dx*k*0.75,y=P0.y+dy*k*0.75;

function unplayable(){

// ---------- V1.1 green reading: bent grid + downhill dots ----------
const SLOPE_COLS=['#bfe0ff','#fff27a','#ffa040','#ff4a3a'];
function slopeCol(m){return m<0.008?SLOPE_COLS[0]:m<0.018?SLOPE_COLS[1]:m<0.032?SLOPE_COLS[2]:SLOPE_COLS[3];}
const GRID_EX=10;
function gridSp(){return cam.s>=9?1:cam.s>=5.5?1.5:cam.s>=3.5?2.5:4;}
function greenGrid(h,sp){
  h.gridCache=h.gridCache||{};const key=sp+'_'+h.pin.x.toFixed(2);if(h.gridCache[key])return h.gridCache[key];
  const r=Math.max(h.ga,h.gb)+3, h0=h.height(h.pin.x,h.pin.y), lines=[], st=sp/4;
  const onG=(x,y)=>{const t=h.surfAt(x,y);return t===S.GREEN||t===S.FRINGE;};
  for(const fam of [0,1])for(let a=-r;a<=r+1e-6;a+=sp){
    let cur=null;
    for(let b=-r;b<=r+1e-6;b+=st){
      const x=h.gc.x+(fam?b:a), y=h.gc.y+(fam?a:b);
      if(!onG(x,y)){if(cur&&cur.length>1)lines.push(cur);cur=null;continue;}
      const g=h.grad(x,y);(cur=cur||[]).push([x,y,(h.height(x,y)-h0)*GRID_EX,Math.hypot(g[0],g[1])]);
    }
    if(cur&&cur.length>1)lines.push(cur);
  }
  h.gridCache[key]={lines,h0};return h.gridCache[key];
}
// V1.2: the bent grid is drawn once into an offscreen canvas and only redrawn when the zoom (or green) changes.
const gridCv=document.createElement('canvas');gridCv.width=gridCv.height=8;
const GC={G:null,s:0,redraws:0};
function drawGreenGrid(h){
  const sp=gridSp();const G=greenGrid(h,sp),s=cam.s;
  if(!G.box){let x0=1e9,x1=-1e9,y0=1e9,y1=-1e9,z0=1e9,z1=-1e9;for(const ln of G.lines)for(const q of ln){x0=Math.min(x0,q[0]);x1=Math.max(x1,q[0]);y0=Math.min(y0,q[1]);y1=Math.max(y1,q[1]);z0=Math.min(z0,q[2]);z1=Math.max(z1,q[2]);}G.box={x0,x1,y0,y1,z0,z1};}
  const B=G.box;if(B.x0>B.x1)return;
  const oX=(B.x0-cam.x)*s+W/2-2, oY=(B.y0-cam.y)*s+H/2-B.z1*s*ZK-2;
  const ix=Math.round(oX),iy=Math.round(oY);
  if(GC.G!==G||GC.s!==s){
    GC.G=G;GC.s=s;GC.redraws++;
    const cw=Math.ceil((B.x1-B.x0)*s)+6, ch=Math.ceil((B.y1-B.y0)*s+(B.z1-B.z0)*s*ZK)+6;
    if(gridCv.width<cw||gridCv.height<ch){gridCv.width=Math.max(gridCv.width,cw);gridCv.height=Math.max(gridCv.height,ch);}
    const o=gridCv.getContext('2d');o.clearRect(0,0,gridCv.width,gridCv.height);
    const keep=ctx;ctx=o;
    try{for(const ln of G.lines){let p0=null;

    finally{ctx=keep;}
  }

}
const gDots=[];
function updGreenDots(dt){
  const h=R.hole;if(gDots.hole!==h){gDots.length=0;gDots.hole=h;}
  const want=GL_OK?90:clamp(Math.round(60+(cam.s-4)*8),60,110),rr=Math.max(h.ga,h.gb)+3,vr=GL_OK?null:[s2w(0,26),s2w(W,186)];
  const x0=vr?vr[0][0]:h.gc.x-rr,x1=vr?vr[1][0]:h.gc.x+rr,y0=vr?vr[0][1]:h.gc.y-rr,y1=vr?vr[1][1]:h.gc.y+rr; // 3D: over the whole green
  let tries=0;
  while(gDots.length<want&&tries++<40){const x=lerp(x0,x1,rnd()),y=lerp(y0,y1,rnd());const t=h.surfAt(x,y);if(t!==S.GREEN&&t!==S.FRINGE)continue;gDots.push({x,y,t:0,life:1.6+rnd()*1.8});}
  for(let i=gDots.length-1;i>=0;i--){const d=gDots[i];d.t+=dt;
    const g=h.grad(d.x,d.y),m=Math.hypot(g[0],g[1]);
    if(m>1e-4){const v=0.25+m*60;d.x-=g[0]/m*v*dt;d.y-=g[1]/m*v*dt;}
    const t=h.surfAt(d.x,d.y);
    if(d.t>d.life||(t!==S.GREEN&&t!==S.FRINGE)||d.x<x0-2||d.x>x1+2||d.y<y0-2||d.y>y1+2)gDots.splice(i,1);}
}
function drawGreenDots(h){

    const [sx,sy]=w2s(d.x,d.y,(h.height(d.x,d.y)-h0)*GRID_EX);ctx.globalAlpha=0.85*a;rect(sx,sy,cam.s>=8?2:1,cam.s>=8?2:1,'#ffffff');}

function playDown(x,y){
  const A=R.A;
  if(curP().isBot&&R.phase==='aim')return true; // V2.2: the bot's turn
  if(R.phase==='tap'){doTap(false);return true;}
  if(R.phase!=='aim'||!A)return false;
  if(R.time-(R.aimT||0)<0.25)return true; // V1.8
  if(GL_OK&&Scene3D.free){ // 3D free camera: drag the landing ring to aim, drag anywhere else to look around
    if(A.mode==='long'&&A.pred){const [lx,ly]=w2s(A.pred.land.x,A.pred.land.y,0);if(Math.hypot(x-lx,y-ly)<30){A.drag={kind:'target',off:angDiff(Math.atan2(A.pred.land.y-R.ball.y,A.pred.land.x-R.ball.x),A.aim)};return true;}}
    Scene3D.look={x,y};return true;}

  const db=Math.hypot(x-bx,y-by);
  if(db<36&&y<186){camT.x=cam.x;camT.y=cam.y;camT.s=cam.s;A.drag={kind:'shot',x0:x,y0:y,c0:A.curve};A.power=0;return true;}
  if(A.mode==='long'&&A.pred){const [lx,ly]=w2s(A.pred.land.x,A.pred.land.y,0);if(lx>0&&lx<W&&ly>26&&ly<186&&Math.hypot(x-lx,y-ly)<18){camT.x=cam.x;camT.y=cam.y;camT.s=cam.s;A.drag={kind:'target',off:angDiff(Math.atan2(A.pred.land.y-R.ball.y,A.pred.land.x-R.ball.x),A.aim)};return true;}}
  if(y<186){A.drag={kind:'swipe',lx:x,ly:y};return true;}

}
const CURVE_PX=42; // sideways pixels for a full draw/fade
function chargeTick(A,np){const st=Math.floor(Math.min(np,1)*10+1e-6);if(st>(A.drag.st|0))AU.play(st===10?'full':'charge',np);A.drag.st=st;} // V1.8
function playMove(x,y){
  if(GL_OK&&Scene3D.look){Scene3D.orbit(x-Scene3D.look.x,y-Scene3D.look.y);Scene3D.look.x=x;Scene3D.look.y=y;return;}
  const A=R.A;if(!A||!A.drag||R.phase!=='aim')return;
  const b=R.ball;const [bx,by]=w2s(b.x,b.y,0);
  if(A.drag.kind==='shot'){
    if(A.drag.x0!==undefined)A.drag.mv=Math.max(A.drag.mv||0,Math.hypot(x-A.drag.x0,y-A.drag.y0)); // how far the finger has moved
    const dx=x-bx,dy=y-by,pull=Math.hypot(dx,dy);
    if(A.mode==='long'){
      // V1.1: pull back sets power, moving sideways sets draw/fade. Aim stays put.
      let back=dy,side=dx; // 3D: the camera looks down the aim line, so pulling down the screen is pulling back
      if(!GL_OK){const ca=Math.cos(A.presetAim),sa=Math.sin(A.presetAim);back=-(dx*ca+dy*sa);side=dx*-sa+dy*ca;}
      const np=pullPower(Math.max(back,pull*0.35));chargeTick(A,np);
      const mc=maxCurve(curP(),A.club);
      const nc=newbie()?0:pull>8?clamp(side/CURVE_PX,-1,1)*mc:A.drag.c0||0; // no curve on a beginner's first hole
      A.drag.mx=Math.max(A.drag.mx||0,np);if(Math.abs(np-A.power)>0.008||Math.abs(nc-A.curve)>0.004){A.power=np;A.curve=Math.abs(nc)<0.03*mc?0:nc;A.aim=A.presetAim;requestPred();}
      return;
    }
    const np=pullPower(pull);chargeTick(A,np);A.drag.mx=Math.max(A.drag.mx||0,np);
    let na=A.presetAim;
    if(pull>8){const off=GL_OK?Math.atan2(-dx,Math.max(1,dy)):angDiff(Math.atan2(-dy,-dx),A.presetAim);const sens=A.mode==='putt'?0.3:0.4;na=A.presetAim+clamp(off*sens,-0.6,0.6);} // 3D: pull down-and-right aims left, like a slingshot
    if(Math.abs(np-A.power)>0.008||Math.abs(na-A.aim)>0.001){A.power=np;A.aim=na;requestPred();}
  } else if(A.drag.kind==='target'){
    const [wx,wy]=s2w(x,y);
    if(GL_OK){ // 3D: the club follows the ring while you drag it (the 2D game picks it when you let go: same club either way)
      const p=curP(),dist=Math.hypot(wx-b.x,wy-b.y),lieD=lieFactor(p,A.lie,'d');let best=A.club,be=1e9;for(const i of allowedClubs(A.lie)){const e=Math.abs(clubCarry(p,i)*lieD-dist);if(e<be){be=e;best=i;}}
      if(best!==A.club){A.club=best;refreshPred();A.drag.off=angDiff(Math.atan2(A.pred.land.y-b.y,A.pred.land.x-b.x),A.aim);AU.play('tick');}}
    A.aim=Math.atan2(wy-b.y,wx-b.x)-A.drag.off;A.presetAim=A.aim;A.drag.tx=wx;A.drag.ty=wy;requestPred();
  } else {
    const dx=x-A.drag.lx,dy=y-A.drag.ly;A.drag.lx=x;A.drag.ly=y;
    if(GL_OK)A.aim+=dx*(A.mode==='putt'?0.0022:0.0042); // 3D: drag sideways to turn the aim
    else{const k=(A.mode==='putt'?0.0025:0.004)*Math.min(1.5,2.4/Math.max(1.2,cam.s)+0.4);A.aim+=(dx*-Math.sin(A.aim)+dy*Math.cos(A.aim))*k;}
    A.presetAim=A.aim;requestPred();
  }
}
function releaseShot(pw){
  const A=R.A;
  const isPutt=A.mode==='putt'||A.type==='PUTT';
  if(OPT.tap&&!tapLocked()){startTap(pw);return;} // V1.9: putts get the tap too
  A.drag=null;executeShot(pw);
}
function playUp(x,y){
  if(GL_OK&&Scene3D.look){Scene3D.look=null;return;}
  const A=R.A;if(!A||!A.drag)return;
  const d=A.drag;
  if(R.phase!=='aim'){A.drag=null;return;}
  if(d.kind==='shot'){
    playMove(x,y);
    const [bx,by]=w2s(R.ball.x,R.ball.y,0);
    const pull=Math.hypot(x-bx,y-by);
    const moved=d.x0===undefined?99:(d.mv||0); // V1.8: pressing and letting go without pulling is a tap, not a shot
    if(pull<10||A.power<0.02||moved<8){const was=moved>=8&&(d.mx||0)>0.12;A.drag=null;A.aim=A.presetAim;A.curve=d.c0||0;A.power=1;refreshPred();if(was){toast('SHOT CANCELLED','#ffd23f',1.4);AU.play('back');}else toast('DRAG BACK FROM THE BALL AND LET GO','#ffd23f',1.8);return;}
    const pw=A.power;A.drag=null;releaseShot(pw);
  } else if(d.kind==='target'){
    A.drag=null;
    if(d.tx!==undefined){ // choose the club that best fits the dragged distance
      const p=curP(),dist=Math.hypot(d.tx-R.ball.x,d.ty-R.ball.y),lieD=lieFactor(p,A.lie,'d');
      let best=A.club,be=1e9;for(const i of allowedClubs(A.lie)){const e=Math.abs(clubCarry(p,i)*lieD-dist);if(e<be){be=e;best=i;}}
      A.club=best;
      refreshPred();const off2=angDiff(Math.atan2(A.pred.land.y-R.ball.y,A.pred.land.x-R.ball.x),A.aim);
      A.aim=Math.atan2(d.ty-R.ball.y,d.tx-R.ball.x)-off2;A.presetAim=A.aim;refreshPred();
    }
  } else {A.drag=null;refreshPred();}
}
function cancelDrag(){if(GL_OK)Scene3D.look=null;const A=R&&R.A;if(A&&A.drag){if(A.drag.kind==='shot'){A.aim=A.presetAim;A.curve=A.drag.c0||0;A.power=1;}A.drag=null;refreshPred();}kbCharge=null;}
// keyboard
let kbCharge=null;
function playKey(k,down){
  if(!R)return;
  if(GL_OK&&Scene3D.free&&k.length===1&&'wasd'.includes(k)){Scene3D.fkey[k]=down;return;} // 3D free camera: W A S D move it
  const A=R.A;
  if(down&&(k==='+'||k==='='||k==='-'||k==='_')&&R.phase!=='card'&&R.phase!=='flyover'&&R.phase!=='pause'){zoomBy(k==='+'||k==='='?1.25:1/1.25);return;}
  if(down&&(k===' '||k==='Enter')){
    if(R.phase==='flyover'){skipFly();return;} if(R.phase==='turn'){R.phase='aim';return;}
    if(R.phase==='flight'){R.fast=true;return;} if(R.phase==='holed'&&R.cele){R.cele.t=R.cele.dur;return;}
    if(R.phase==='tap'){doTap(false);return;}
    if(R.phase==='chnext'){if(R.ft>0.4)R.ft=99;return;}
  }
  if(R.phase!=='aim'||!A||curP().isBot)return;
  if(k===' '){
    if(down&&!kbCharge){kbCharge={t0:performance.now()};A.drag={kind:'shot',c0:A.curve};A.power=0;}
    else if(!down&&kbCharge){A.drag=null;const p=A.power;kbCharge=null;if(p<0.03){A.power=1;refreshPred();return;}releaseShot(p);}
    return;
  }
  if(!down)return;
  const step=A.mode==='putt'?0.0035:0.0087;
  if(k==='ArrowLeft'){A.aim-=step;A.presetAim=A.aim;requestPred();}
  if(k==='ArrowRight'){A.aim+=step;A.presetAim=A.aim;requestPred();}
  if(k==='u'&&A.unplay)unplayable();
  if(k==='q'&&A.mode==='long'&&!newbie()){cycleCurve();AU.play('click');}
  if(A.mode==='short'&&(k==='ArrowUp'||k==='ArrowDown')){const types=A.lie===S.SAND?['SAND','CHIP','PITCH','FLOP']:A.lie===S.FRINGE?['PUTT','CHIP','PITCH','FLOP','BUMP']:['CHIP','PITCH','FLOP','BUMP'];let i=types.indexOf(A.type);i=(i+(k==='ArrowUp'?-1:1)+types.length)%types.length;A.type=types[i];fitShotCam(false);}
}
function cycleCurve(){const A=R&&R.A;if(!A||A.mode!=='long'||newbie())return;const mc=maxCurve(curP(),A.club),f=[0,-0.5,-1,0.5,1];let i=f.findIndex(v=>Math.abs(v*mc-A.curve)<0.01);i=(i+1)%f.length;A.curve=f[i]*mc;refreshPred();}

function logoBall(cx,cy,y0,part){
  const R=6.8,inR=(ux,uy,r)=>Math.hypot(ux+0.5,uy+0.5)<=r;
  if(part===0){ctx.fillStyle='#0b122699';for(let uy=-8;uy<8;uy++)for(let ux=-8;ux<8;ux++)if(inR(ux,uy,R+1))ctx.fillRect(cx+ux*2+3,cy+uy*2+4,2,2);
    ctx.fillStyle='#0b1226';for(let uy=-8;uy<8;uy++)for(let ux=-8;ux<8;ux++)if(inR(ux,uy,R+1))ctx.fillRect(cx+ux*2,cy+uy*2,2,2);return;}
  const sh=['#ffffff','#ffffff','#f2f6ff','#e2ecff','#d0e0fa','#bcd0f2','#a8c0e8'];
  for(let uy=-8;uy<8;uy++)for(let ux=-8;ux<8;ux++){if(!inR(ux,uy,R))continue;
    const b=clamp(Math.floor((cy+uy*2-y0)/5),0,6);let c=sh[b];
    if((ux+0.5)*0.55+(uy+0.5)*0.83>R*0.62)c='#93acd8'; // shade on the lower right
    else if(uy%3===0&&(ux+((uy/3)&1)*2)%4===0&&inR(ux,uy,R-1.2))c=b<3?'#d6e2f6':'#9fb6dc'; // dimples
    ctx.fillStyle=c;ctx.fillRect(cx+ux*2,cy+uy*2,2,2);}
}

  } else if(kind==='wind'){

  // holes per tier: Local Cups are 3; MIXED = Regional and National 9, Pro Tour and majors 18

  tierFloors(t,n){const T=TIERS[t];return {topN:Math.ceil(n/2),top:T.top,bottom:T.bot,stepT:T.top/30,stepB:T.bot/30};},

  rank(){const d=this.d;const list=d.field.map(f=>f.sm).concat([d.sm]).sort((a,b)=>b-a);return list.indexOf(d.sm)+1;},
  simField(ev){

// ---------- V2.1 scrolling lists ----------
// Drag anywhere in the list (or use the mouse wheel) to scroll. A gold bar on the right shows where you are,
// and a fade with an arrow at the bottom shows there's more below.
const SCRL={};
function scrollArea(id,x,y,w,h,contentH,draw){
  const st=SCRL[id]||(SCRL[id]={y:0});
  const max=Math.max(0,contentH-h);st.max=max;st.y=clamp(st.y,0,max);
  UI.scrolls.push({id,x,y,w,h});
  const nb=UI.btns.length;
  ctx.save();ctx.beginPath();ctx.rect(x,y,w,h);ctx.clip();UICLIP={x,y,w,h};
  try{draw(y-Math.round(st.y));
    if(max>0&&st.y<max-2){ // more below
      for(let i=0;i<12;i++){ctx.globalAlpha=i/16;rect(x,y+h-12+i,w-7,1,'#0b1226');}ctx.globalAlpha=1;
      const ax=x+(w-7)/2,ay=y+h-7+Math.round(Math.sin(gTime*5));
      rect(ax-4,ay-2,9,1,COL.gold);rect(ax-3,ay-1,7,1,COL.gold);rect(ax-2,ay,5,1,COL.gold);rect(ax-1,ay+1,3,1,COL.gold);rect(ax,ay+2,1,1,COL.gold);
    }
  }finally{ctx.restore();UICLIP=null;}
  // buttons scrolled out of view can't be pressed; the half-visible ones only where they show
  for(let i=UI.btns.length-1;i>=nb;i--){const b=UI.btns[i];const t=Math.max(b.y,y),bt=Math.min(b.y+b.h,y+h);if(bt<=t){UI.btns.splice(i,1);continue;}b.y=t;b.h=bt-t;}
  if(max>0){const tx=x+w-5;rect(tx,y,5,h,'#000');rect(tx+1,y+1,3,h-2,'#24386a');
    const th=Math.max(14,(h-2)*h/contentH),tyy=y+1+(h-2-th)*st.y/max;rect(tx+1,tyy,3,th,COL.gold);}
}
function scrollTo(id,v){const st=SCRL[id]||(SCRL[id]={y:0});st.y=Math.max(0,v);}

// the button under (x,y): an exact hit wins; otherwise the nearest button within pad pixels
function btnAt(x,y,pad){
  for(let i=UI.btns.length-1;i>=0;i--){const b=UI.btns[i];if(inRect(x,y,b.x,b.y,b.w,b.h))return b;}
  if(!pad)return null;
  let best=null,bd=1e9;
  for(let i=UI.btns.length-1;i>=0;i--){const b=UI.btns[i];
    const dx=Math.max(b.x-x,0,x-(b.x+b.w)),dy=Math.max(b.y-y,0,y-(b.y+b.h)),d=Math.hypot(dx,dy);
    if(d<=pad&&d<bd){bd=d;best=b;}}
  return best;
}

cv.addEventListener('pointerdown',e=>{
  if(modalOpen()||inputBlocked())return;
  // V1.8: take the keyboard focus (in the CrazyGames frame the page around the game could keep it, so SPACE and the
  // arrow keys went to the page), and a new first finger means any finger still remembered is stale
  if(document.activeElement!==cv){try{window.focus();cv.focus({preventScroll:true});}catch(_){}}
  if(e.isPrimary&&(ptrs.size||activePtr!==null))resetInput();
  AU.init();

  touchUI=e.pointerType!=='mouse';if(touchUI)hoverXY=null;
  ptrs.set(e.pointerId,evPos(e));
  try{cv.setPointerCapture(e.pointerId);}catch(_){}
  if(ptrs.size===2&&screen==='play'&&R&&R.phase!=='card'&&R.phase!=='flyover'){
    cancelDrag();UI.press=null;activePtr=null;UI.ptr.down=false;
    pinch={d0:pinchDist(),z0:cam.s,cat:zoomCat(R.A),fd0:GL_OK&&Scene3D.free?Scene3D.fc.dist:0,c0:pinchMid()};return;
  }
  if(pinch||ptrs.size>1)return;
  if(activePtr!==null&&activePtr!==e.pointerId)return;
  activePtr=e.pointerId;
  const [x,y]=evPos(e);UI.ptr={x,y,down:true};
  UI.sd=null;if(screen!=='play'){const s=UI.scrolls.find(s=>inRect(x,y,s.x,s.y,s.w,s.h));if(s&&SCRL[s.id])UI.sd={id:s.id,y0:y,s0:SCRL[s.id].y,mv:false};} // V2.1: drag to scroll
  const sc=SCREENS[screen];

// Everything that talks to CrazyGames lives here. If their script didn't load (offline, ad blocker, school network,
// or the game is hosted somewhere else) every call quietly does nothing and the game plays exactly as before.
// V1.6: build.py sets this to false for the CrazyGames Basic Launch upload (no ads allowed then)

  init(){
    const CG=window.CrazyGames&&window.CrazyGames.SDK;

    let late=false;
    const t=setTimeout(()=>{late=true;this.ready=true;console.warn('CrazyGames SDK slow to start; playing without it for now');},7000);
    Promise.resolve().then(()=>CG.init()).then(()=>{
      clearTimeout(t);this.env=CG.environment;

  hook(early){

    if(early&&CG.data){try{CG.data.getItem(SAVE_KEYS[0]);Store.useCloud(CG.data);loadOpts();Ach.load();Career.d=null;}catch(e){console.warn('CrazyGames saves unavailable, using this browser',e);}}

  call(fn){try{if(this.sdk)this.sdk.game[fn]();}catch(e){console.warn('CrazyGames '+fn,e);}},

  tick(){

  midgame(next){

// ======== hud3.js ========
// ============ RETRO GOLF 3D: the play HUD, drawn smooth and kept small ============
// The 2D game needed a lot of boxes and bars on screen. In 3D most of that is shown in the world instead (the flight line,
// the landing ring, the slope grid), so the HUD here is a few glass "pills" in the corners, a power ring round the ball and
// a swing meter. The buttons keep the same names and keys as the 2D game, so every rule and shortcut still works.
// Everything in this file is only used by the 3D game (the 2D fallback keeps the old HUD).

function glass(x,y,w,h,r,a){r=r===undefined?4:r;if(UIBOX)ubox({k:'c',x,y,w,h});ctx.fillStyle='rgba(8,16,36,'+(a===undefined?0.6:a)+')';rrPath(x,y,w,h,r);ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,0.16)';ctx.lineWidth=0.5;rrPath(x+0.25,y+0.25,w-0.5,h-0.5,r);ctx.stroke();}
function keycap(x,y,s){const w=Math.max(9,textW(s)+5);if(UIBOX)ubox({k:'c',x,y,w,h:9});ctx.fillStyle='rgba(255,255,255,0.16)';rrPath(x,y,w,9,2);ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,0.5)';ctx.lineWidth=0.5;rrPath(x+0.25,y+0.25,w-0.5,8.5,2);ctx.stroke();txt(s,x+w/2,y+1,'#ffffff',1,1);return w;}
// small line-drawn icons, centred on x,y, about 2*s across
function icon3(name,x,y,s,c){
  ctx.save();ctx.translate(x,y);ctx.fillStyle=c;ctx.strokeStyle=c;ctx.lineWidth=Math.max(0.8,s*0.22);ctx.lineCap='round';ctx.lineJoin='round';
  if(name==='pause'){rrPath(-s*0.6,-s*0.75,s*0.42,s*1.5,s*0.15);ctx.fill();rrPath(s*0.18,-s*0.75,s*0.42,s*1.5,s*0.15);ctx.fill();}
  else if(name==='sound'||name==='mute'){ctx.beginPath();ctx.moveTo(-s,-s*0.32);ctx.lineTo(-s*0.5,-s*0.32);ctx.lineTo(0,-s*0.8);ctx.lineTo(0,s*0.8);ctx.lineTo(-s*0.5,s*0.32);ctx.lineTo(-s,s*0.32);ctx.closePath();ctx.fill();
    if(name==='sound'){ctx.beginPath();ctx.arc(0,0,s*0.55,-0.8,0.8);ctx.stroke();ctx.beginPath();ctx.arc(0,0,s*0.95,-0.8,0.8);ctx.stroke();}
    else{ctx.strokeStyle='#ff7070';ctx.beginPath();ctx.moveTo(s*0.3,-s*0.4);ctx.lineTo(s*0.95,s*0.4);ctx.moveTo(s*0.95,-s*0.4);ctx.lineTo(s*0.3,s*0.4);ctx.stroke();}}
  else if(name==='cam'){rrPath(-s,-s*0.55,s*1.45,s*1.15,s*0.2);ctx.fill();ctx.beginPath();ctx.moveTo(s*0.45,-s*0.1);ctx.lineTo(s,-s*0.5);ctx.lineTo(s,s*0.55);ctx.lineTo(s*0.45,s*0.15);ctx.closePath();ctx.fill();}
  else if(name==='eye'){ctx.beginPath();ctx.moveTo(-s,0);ctx.quadraticCurveTo(0,-s*1.1,s,0);ctx.quadraticCurveTo(0,s*1.1,-s,0);ctx.stroke();ctx.beginPath();ctx.arc(0,0,s*0.36,0,6.2832);ctx.fill();}
  else if(name==='target'){ctx.beginPath();ctx.arc(0,0,s*0.85,0,6.2832);ctx.stroke();ctx.beginPath();ctx.arc(0,0,s*0.25,0,6.2832);ctx.fill();ctx.beginPath();ctx.moveTo(0,-s*1.2);ctx.lineTo(0,-s*0.55);ctx.moveTo(0,s*0.55);ctx.lineTo(0,s*1.2);ctx.moveTo(-s*1.2,0);ctx.lineTo(-s*0.55,0);ctx.moveTo(s*0.55,0);ctx.lineTo(s*1.2,0);ctx.stroke();}
  else if(name==='map'){ctx.beginPath();ctx.moveTo(-s,-s*0.6);ctx.lineTo(-s*0.33,-s*0.85);ctx.lineTo(s*0.33,-s*0.6);ctx.lineTo(s,-s*0.85);ctx.lineTo(s,s*0.6);ctx.lineTo(s*0.33,s*0.85);ctx.lineTo(-s*0.33,s*0.6);ctx.lineTo(-s,s*0.85);ctx.closePath();ctx.stroke();ctx.beginPath();ctx.moveTo(-s*0.33,-s*0.85);ctx.lineTo(-s*0.33,s*0.6);ctx.moveTo(s*0.33,-s*0.6);ctx.lineTo(s*0.33,s*0.85);ctx.stroke();}
  else if(name==='fast'){for(const o of [-s*0.55,s*0.25]){ctx.beginPath();ctx.moveTo(o-s*0.35,-s*0.7);ctx.lineTo(o+s*0.45,0);ctx.lineTo(o-s*0.35,s*0.7);ctx.closePath();ctx.fill();}}
  else if(name==='left'||name==='right'){const k=name==='left'?-1:1;ctx.lineWidth=Math.max(1,s*0.34);ctx.beginPath();ctx.moveTo(-k*s*0.35,-s*0.7);ctx.lineTo(k*s*0.4,0);ctx.lineTo(-k*s*0.35,s*0.7);ctx.stroke();}
  else if(name==='flag'){ctx.beginPath();ctx.moveTo(-s*0.4,s);ctx.lineTo(-s*0.4,-s);ctx.stroke();ctx.beginPath();ctx.moveTo(-s*0.4,-s);ctx.lineTo(s*0.8,-s*0.55);ctx.lineTo(-s*0.4,-s*0.1);ctx.closePath();ctx.fill();}
  ctx.restore();
}
// a round glass button with an icon. Same id / key rules as the 2D game's buttons
function ibtn(x,y,r,name,onClick,o){
  if(UIBOX)ubox({k:'c',x:x-r,y:y-r,w:r*2,h:r*2});
  o=o||{};const id=o.id||name,pr=UI.press&&UI.press.id===id&&UI.ptr.down,hv=!pr&&hoverXY&&!UI.ptr.down&&Math.hypot(hoverXY[0]-x,hoverXY[1]-y)<r;
  ctx.fillStyle=o.on?'rgba(242,182,50,0.92)':pr?'rgba(40,60,110,0.9)':hv?'rgba(30,48,96,0.82)':'rgba(8,16,36,0.6)';ctx.beginPath();ctx.arc(x,y,r,0,6.2832);ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,0.22)';ctx.lineWidth=0.5;ctx.beginPath();ctx.arc(x,y,r-0.25,0,6.2832);ctx.stroke();
  icon3(name,x,y,r*0.48,o.on?'#14213d':'#ffffff');
  UI.btns.push({x:x-r,y:y-r,w:r*2,h:r*2,onClick,dis:false,id,key:o.key,snd:o.snd});
}
// an arrow key (dir: LEFT RIGHT UP DOWN)
function keyA(x,y,dir){
  ctx.fillStyle='rgba(255,255,255,0.16)';rrPath(x,y,9,9,2);ctx.fill();ctx.strokeStyle='rgba(255,255,255,0.5)';ctx.lineWidth=0.5;rrPath(x+0.25,y+0.25,8.5,8.5,2);ctx.stroke();
  ctx.save();ctx.translate(x+4.5,y+4.5);ctx.rotate({RIGHT:0,DOWN:Math.PI/2,LEFT:Math.PI,UP:-Math.PI/2}[dir]);ctx.fillStyle='#ffffff';ctx.beginPath();ctx.moveTo(2.5,0);ctx.lineTo(-1.6,-2.5);ctx.lineTo(-1.6,2.5);ctx.closePath();ctx.fill();ctx.restore();return 9;
}
// the keys, along the bottom edge the whole time you are aiming: items = [[keys], what they do]
const KEY_ARROWS={LEFT:1,RIGHT:1,UP:1,DOWN:1};
function keyLegend(items){
  const wk=k=>KEY_ARROWS[k]?9:Math.max(9,textW(k)+5);
  let tot=-9;for(const it of items){for(const k of it[0])tot+=wk(k)+1.5;tot+=2+textW(it[1])+9;}
  const g=ctx.createLinearGradient(0,H-20,0,H);g.addColorStop(0,'rgba(5,10,24,0)');g.addColorStop(1,'rgba(5,10,24,0.6)');ctx.fillStyle=g;ctx.fillRect(0,H-20,W,20);
  let x=W/2-tot/2;const y=H-11;
  for(const it of items){for(const k of it[0]){if(KEY_ARROWS[k])keyA(x,y,k);else keycap(x,y,k);x+=wk(k)+1.5;}x+=2;txt(it[1],x,y+1,'#e6ecfa',1,0,'#000000');x+=textW(it[1])+9;}
}
// a glass control with a small grey title and its value underneath. kc = its key, shown as a tab on the corner
function pill3(x,y,w,h,top,val,o){
  o=o||{};const id=o.id,pr=UI.press&&UI.press.id===id&&UI.ptr.down,hv=!pr&&hoverXY&&!UI.ptr.down&&inRect(hoverXY[0],hoverXY[1],x,y,w,h);

// wind: an arrow on a little dial. Up on the dial is the way the camera looks, so it shows how the wind will push this shot.
// returns the left edge of the card
function windCard(){
  const sp=R.wind.spd,c=windCol(sp),rel=R.wind.ang-Scene3D.viewYaw(),gl=R.weather==='STORM'?Math.sin(R.time*3)*0.8:0;
  const ws=OPT.kmh?Math.round(sp*3.6+gl*4)+' KM/H':Math.round(sp*2.237+gl*2.5)+' MPH';
  const l2=R.weather==='STORM'?'GUSTY!':(!newbie()&&R.D&&R.D.windPrev<0.995)?'AIM SHOWS '+Math.round(R.D.windPrev*100)+'%':'WIND';
  const w=Math.max(textW(ws),textW(l2))+33,x=W-4-w,dx=x+13.5,dy=16.5,r=9;
  glass(x,4,w,25,5);
  ctx.fillStyle='rgba(255,255,255,0.1)';ctx.beginPath();ctx.arc(dx,dy,r,0,6.2832);ctx.fill();
  if(sp>0.05){ctx.save();ctx.translate(dx,dy);ctx.rotate(rel);const k=1+Math.sin(R.time*5)*0.06*Math.min(1,sp/6);ctx.scale(k,k);ctx.fillStyle=c;
    ctx.beginPath();ctx.moveTo(0,-r*0.82);ctx.lineTo(r*0.52,-r*0.05);ctx.lineTo(r*0.18,-r*0.05);ctx.lineTo(r*0.18,r*0.78);ctx.lineTo(-r*0.18,r*0.78);ctx.lineTo(-r*0.18,-r*0.05);ctx.lineTo(-r*0.52,-r*0.05);ctx.closePath();ctx.fill();ctx.restore();}
  else{ctx.fillStyle='#9fb0d0';ctx.beginPath();ctx.arc(dx,dy,1.6,0,6.2832);ctx.fill();}
  txt(ws,x+27,7,c);txt(l2,x+27,18,R.weather==='STORM'?'#ff9080':'#9fb0d0');
  return x;
}
function drawHUD3(dt){
  UI.btns.length=0;pwTop=false;
  const h=R.hole,p=curP(),A=R.A,ph=R.phase;
  if(ph==='flyover'){hudFly3(dt);return;}
  if(ph==='card'){drawCard();return;}
  const nb=newbie(),free=Scene3D.free&&ph==='aim';
  // ---- top left: hole, par, length / who, which shot, score ----
  glass(4,4,142,25,5);
  if(R.ch){const ch=R.ch,tot=chTotal(ch),n=Math.min(ch.i+1,ch.n);
    txt(CH_INFO[ch.type].name,10,7,COL.gold);
    txt(ch.type==='LD'?'BALL '+n+'/'+ch.n+'   BEST '+(tot===null?'--':tot+'M'):ch.type==='SO'?(R.rk.botDist==null?'BOT SHOOTS FIRST':'BEAT '+R.rk.botDist.toFixed(1)+'M'):ch.type==='CTP'?'SHOT '+n+'/'+ch.n+'   TOTAL '+(tot===null?'0.0':tot.toFixed(1))+'M':'PUTT '+n+'/'+ch.n+'   HOLED '+(tot||0),10,18,'#ffffff');
    if(R.rk)rankedHud3();
  } else {
    txt('HOLE '+(R.hn+1),10,7,COL.gold);txt('PAR '+h.par,10+textW('HOLE '+(R.hn+1))+8,7,'#ffffff');txt(h.len+'M',10+textW('HOLE '+(R.hn+1))+8+textW('PAR '+h.par)+7,7,'#9fb0d0');
    if(R.rk){rankedHud3();const me=R.players[0],tp2=playerToPar(me,R.holes.length);txt(curP().isBot?"BOT'S TURN":'YOUR TURN',10,18,curP().isBot?'#ff9a9a':'#7fff9f');txt(toPar(tp2),140,7,tp2<0?'#ff7070':tp2>0?'#8fb8ff':'#fff',1,2);}
    else{const tp=playerToPar(p,R.holes.length),phz=ph==='pause'?R.prevPhase:ph,played=phz==='swing'||phz==='flight'||phz==='settle'||phz==='holed',sn='SHOT '+Math.max(1,played?p.cur.strokes:p.cur.strokes+1);
      ctx.fillStyle=p.col||'#e04040';ctx.beginPath();ctx.arc(12.5,21.6,2.5,0,6.2832);ctx.fill();
      if(R.players.length>1){txt(shortName(p.name,9),18,18,'#ffffff');txt(sn,18+textW(shortName(p.name,9))+7,18,'#9fb0d0');}else txt(sn,18,18,'#cfd6e6');
      txt(toPar(tp),140,7,tp<0?'#ff7070':tp>0?'#8fb8ff':'#fff',1,2);
      if((R.event||R.mode==='online')&&!nb){const lb=leaderboard(),me=lb.find(r=>r.user);if(me)txt('POS '+posLabel(me),140,18,COL.gold,1,2);}
    }
  }
  // ---- top right: wind, pause, sound, and the map under them ----
  const hide=ph==='holed'&&R.cele;let wx=W-4;
  if(!hide){
    wx=windCard();
    if(OPT.map!==false&&!nb&&!free){const mm=h.mm,mx=W-mm.w-5,my=34;
      ctx.save();rrPath(mx-1,my-1,mm.w+2,mm.h+2,4);ctx.clip();ctx.globalAlpha=0.88;ctx.imageSmoothingEnabled=true;ctx.drawImage(mm.c,mx,my,mm.w,mm.h);ctx.imageSmoothingEnabled=false;ctx.globalAlpha=1;
      const mp=(x,y)=>[mx+(x-h.G.x0)*mm.sc,my+(y-h.G.y0)*mm.sc],q=mp(h.pin.x,h.pin.y),bq=mp(R.ball.x,R.ball.y);
      if(A&&A.pred&&ph==='aim'){const l=mp(A.pred.land.x,A.pred.land.y);ctx.strokeStyle='#ffd23f';ctx.lineWidth=0.8;ctx.beginPath();ctx.moveTo(bq[0],bq[1]);ctx.lineTo(l[0],l[1]);ctx.stroke();ctx.fillStyle='#ffd23f';ctx.beginPath();ctx.arc(l[0],l[1],1.3,0,6.2832);ctx.fill();}
      if(R.rk)R.players.forEach(pl=>{if(pl===curP()||pl.cur.bx==null||(pl.cur.done&&!pl.cur.mark))return;const o2=mp(pl.cur.bx,pl.cur.by);ctx.fillStyle=pl.isBot?'#ff5050':COL.gold;ctx.beginPath();ctx.arc(o2[0],o2[1],1.4,0,6.2832);ctx.fill();});
      ctx.fillStyle='#e22';ctx.fillRect(q[0],q[1]-4,2.6,1.8);ctx.fillStyle='#fff';ctx.fillRect(q[0]-0.3,q[1]-4,0.6,4.5);
      ctx.fillStyle='#000';ctx.beginPath();ctx.arc(bq[0],bq[1],1.9,0,6.2832);ctx.fill();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(bq[0],bq[1],1.2,0,6.2832);ctx.fill();
      ctx.restore();ctx.strokeStyle='rgba(255,255,255,0.3)';ctx.lineWidth=0.5;rrPath(mx-1,my-1,mm.w+2,mm.h+2,4);ctx.stroke();}
  }
  if(ph==='pause'){drawPause();return;}
  ibtn(wx-13,16.5,8.5,'pause',()=>{if(R.phase!=='pause'){R.prevPhase=R.phase;R.phase='pause';}},{key:'p',id:'pause'});

    if(c.big)bb=bigBanner(c.name,c.col,c.sub||(R.event?'+$25,000 BONUS!':'INCREDIBLE SHOT!'),R.time,4,30,c.t);else bb=bigBanner(c.name,c.col,c.sub,R.time,3,30,c.t);

  ctx.fillStyle=bg;rrPath(x,y,w,11,5.5);ctx.fill();txt(lab,x+w/2,y+2,fg,1,1);
  if(ax!=null){const ay=y+12.5+Math.abs(Math.sin(R.time*5))*1.5;ctx.fillStyle=bg;ctx.beginPath();ctx.moveTo(ax-3,ay);ctx.lineTo(ax+3,ay);ctx.lineTo(ax,ay+3.6);ctx.closePath();ctx.fill();}
}
// the finger in the first-shot lesson: a round touch marker just under the point it presses
function handM(x,y,press){
  const r=press?4.2:5;ctx.fillStyle='rgba(0,0,0,0.35)';ctx.beginPath();ctx.arc(x+0.6,y+5.8,r+0.6,0,6.2832);ctx.fill();
  ctx.fillStyle=press?'#ffe680':'#ffffff';ctx.beginPath();ctx.arc(x,y+5,r,0,6.2832);ctx.fill();ctx.strokeStyle='#14213d';ctx.lineWidth=0.8;ctx.stroke();
  if(press){ctx.strokeStyle='rgba(255,230,128,0.75)';ctx.lineWidth=0.7;ctx.beginPath();ctx.arc(x,y+5,r+2.4,0,6.2832);ctx.stroke();}
}

// ======== net.js ========
// ============ RETRO GOLF 3D: online matches against real players ============
// Up to 4 players join a room (a 4-letter code, or QUICK MATCH) and play the same holes at the same time. Everyone plays
// their own ball with the normal rules; your game tells the server where your golfer and ball are about five times a
// second and gets the others back, so you see them on the course and on the leaderboard. Lowest score wins.
// Everybody gets the same golfer skills (the quick-round ones), the same wind and the same holes, so it is a fair match.
// The server is online/server.js. Nothing is typed between players except golfer names (capital letters and numbers).
const ONLINE_URL='https://golf-3d.onrender.com'.replace(/^\/\*.*\*\/$/,'');   // build.js writes the match server's address here (online/server-url.txt)
const NET_POSES=['address','putt','celebrate','fist','sad','idle'],NET_KINDS=['full','chip','putt'],NET_CLUBS=['wood','iron','wedge','putter'];
const Net={
  id:null,key:null,code:null,room:null,err:'',info:'',wait:false,acc:0,fails:0,round:0,fin:false,last:null,oth:new Map(),joining:false,
  sendSet:null,sendStart:false,sendAgain:false,
  // where the match server is: on a developer's own computer the page's own address; otherwise the address built into the
  // game, or one typed in OPTIONS (for a server on the same wifi); a page that was itself served by a server uses that
  base(){const h=location.hostname;if(location.protocol!=='file:'&&(h==='localhost'||h==='127.0.0.1'))return location.origin;
    const u=String(OPT.server||ONLINE_URL||'').replace(/\/+$/,'');if(u)return u;return location.protocol==='file:'?'':location.origin;},
  async post(what,obj,ms){
    const ctl=new AbortController(),tm=setTimeout(()=>ctl.abort(),ms||7000);
    try{const r=await fetch(this.base()+'/api/'+what,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify(obj),signal:ctl.signal,cache:'no-store'});
      let j;try{j=await r.json();}catch(e){throw Object.assign(new Error('NOT READY'),{waking:true});}if(j.err)throw Object.assign(new Error(j.err),{server:true});return j;}
    finally{clearTimeout(tm);}
  },
  name(){if(!OPT.onName){OPT.onName=(Career.d&&Career.d.name)||randomName();saveOpts();}return OPT.onName;},
  // my golfer's look: the career golfer if there is one, otherwise a plain one (the shirt takes my colour in the room)
  look(){if(Career.d&&Career.d.look)return Career.d.look;const i=this.slot();return {skin:SKINS[1],hairS:HAIRS[0],hairC:HAIRC[0],shirt:PLAYER_COLS[i<0?0:i%4],pants:PANTS[0]};},
  slot(){return this.room?this.room.players.findIndex(p=>p.id===this.id):-1;},
  isHost(){return !!this.room&&this.room.host===this.id;},
  jt:0,
  join(mode,code){
    if(this.joining)return;this.joining=true;this.err='';this.info='CONNECTING...';
    const tok=++this.jt,t0=Date.now();let fast=0;const fail=m=>{this.joining=false;this.info='';this.err=m;};
    // keep trying while the server wakes up; give up straight away only when the answer is a quick, flat no (no internet, blocked, wrong address)
    const go1=()=>{const t1=Date.now();this.post('join',{mode,code,name:this.name(),look:this.look()},15000).then(j=>{if(tok!==this.jt)return;this.joining=false;this.info='';this.id=j.id;this.key=j.key;this.code=j.room.code;this.round=j.room.round;this.fails=0;this.fin=false;this.last=null;this.oth.clear();this.onRoom(j.room);},
      e=>{if(tok!==this.jt)return;if(e.server)return fail(e.message);if(!e.waking&&Date.now()-t1<1500)fast++;else fast=0;
        if(fast>=3||Date.now()-t0>80000)return fail('CANNOT REACH THE MATCH SERVER');
        this.info='WAKING THE SERVER UP. UP TO A MINUTE...';setTimeout(go1,fast?1500:600);});};
    go1();
  },
  leave(){this.jt++;this.joining=false;this.info='';if(this.code)this.post('leave',{code:this.code,id:this.id,key:this.key}).catch(()=>{});this.code=this.id=this.key=this.room=null;this.oth.clear();this.fin=false;this.last=null;},
  drop(msg){this.code=this.id=this.key=this.room=null;this.oth.clear();this.err=msg;
    if(screen==='play'&&R&&R.mode==='online'){toast(msg+' - YOU CAN FINISH THE ROUND','#ff9a9a',4);}else if(screen==='onresults'||screen==='online')go('online');},
  // what my golfer is doing right now
  me(){
    const p=R.players[0],b=R.ball,ph=R.phase==='pause'?(R.prevPhase||'aim'):R.phase,mov=ph==='flight'||ph==='settle'||ph==='holed',P=Scene3D.lastPose||{pose:'address',phi:0,kind:'full',club:'iron'},r2=v=>Math.round(v*100)/100;
    const code=ph==='card'?4:ph==='holed'?3:(ph==='swing'||ph==='flight'||ph==='settle')?2:(ph==='aim'||ph==='turn'||ph==='tap')?1:0;
    return {hn:R.hn,st:p.cur?p.cur.strokes:0,sc:p.scores.filter(s=>s!=null),ph:code,x:r2(b.x),y:r2(b.y),z:r2(b.z),gx:r2(mov&&b.sx!==undefined?b.sx:b.x),gy:r2(mov&&b.sy!==undefined?b.sy:b.y),
      aim:Math.round((R.A?R.A.aim:R.hole.head0)*1000)/1000,phi:r2(P.phi||0),po:Math.max(0,NET_POSES.indexOf(P.pose)),kd:Math.max(0,NET_KINDS.indexOf(P.kind)),cl:Math.max(0,NET_CLUBS.indexOf(P.club))};
  },
  // called every frame: moves the rivals along smoothly between reports
  tick(dt){for(const o of this.oth.values())o.u=Math.min(1,o.u+dt*1000/o.gap);},
  // called by a timer about five times a second (a timer, not the picture, so a player whose tab is in the background is
  // not dropped from the room): tells the server what I am doing and hears about the others
  pump(){
    if(!this.code||this.wait)return;
    this.wait=true;
    const b={code:this.code,id:this.id,key:this.key,round:this.round};
    if(screen==='play'&&R&&R.mode==='online'){this.last=this.me();b.me=this.last;}else if(this.fin&&this.last){this.last.ph=5;b.me=this.last;}
    if(this.room&&this.room.state==='lobby')b.look=this.look();
    if(this.sendSet){b.set=this.sendSet;this.sendSet=null;}if(this.sendStart){b.start=true;this.sendStart=false;}if(this.sendAgain){b.again=true;this.sendAgain=false;}
    const code=this.code;
    this.post('sync',b).then(j=>{this.wait=false;if(this.code!==code)return;this.fails=0;this.onRoom(j.room);},
      e=>{this.wait=false;if(this.code!==code)return;if(e.server)this.drop(e.message);else if(++this.fails>40)this.drop('CONNECTION LOST');});
  },
  onRoom(room){
    const was=this.room;this.room=room;const seen=new Set(),t=performance.now();
    room.players.forEach((p,i)=>{p.col=PLAYER_COLS[i%4];if(p.id===this.id)return;seen.add(p.id);
      let o=this.oth.get(p.id);if(!o){o={a:null,b:null,u:1,gap:200,t:0};this.oth.set(p.id,o);}
      o.name=p.name;o.col=p.col;o.look=p.look&&p.look.skin?p.look:{skin:SKINS[1],hairS:HAIRS[0],hairC:HAIRC[0],shirt:p.col,pants:PANTS[0]};
      if(p.me){o.a=this.cur(o)||p.me;o.b=p.me;o.gap=o.t?clamp(t-o.t,120,700):200;o.t=t;o.u=0;}else{o.a=o.b=null;}});
    for(const k of [...this.oth.keys()])if(!seen.has(k))this.oth.delete(k);
    if(room.state==='play'&&room.round!==this.round){this.round=room.round;this.fin=false;this.last=null;if(screen==='online'||screen==='onresults')this.begin();}
    if(room.state==='lobby'&&was&&was.state==='play'&&(screen==='onresults'||(screen==='play'&&R&&R.mode==='online'))){go('online');}
  },
  // where a rival is right now, smoothed between the last two reports
  cur(o){
    const a=o.a,b=o.b;if(!b)return null;if(!a||a.hn!==b.hn||Math.hypot(b.gx-a.gx,b.gy-a.gy)>3||o.u>=1)return b;
    const u=o.u,L=(p,q)=>p+(q-p)*u;return {...b,x:L(a.x,b.x),y:L(a.y,b.y),z:L(a.z,b.z),phi:L(a.phi,b.phi),aim:a.aim+angDiff(b.aim,a.aim)*u};
  },
  // the rivals standing on the hole I am playing
  // Golfers whose balls lie on the same spot (everyone starts on the tee) do not stand inside each other: the later ones
  // step back from the ball, as if waiting for their turn.
  vis(){const out=[],b=R.ball,ph=R.phase,mov=ph==='flight'||ph==='settle'||ph==='holed',taken=[[mov&&b.sx!==undefined?b.sx:b.x,mov&&b.sy!==undefined?b.sy:b.y]];
    for(const o of this.oth.values()){const s0=this.cur(o);if(!s0||s0.hn!==R.hn||s0.ph<1||s0.ph>3)continue;const s={...s0};
      for(let k=0;k<4&&taken.some(t=>Math.hypot(t[0]-s.gx,t[1]-s.gy)<1.6);k++){s.gx+=Math.sin(s.aim)*2.1-Math.cos(s.aim)*0.9;s.gy+=-Math.cos(s.aim)*2.1-Math.sin(s.aim)*0.9;s.wait=true;}
      taken.push([s.gx,s.gy]);out.push({o,s});}
    return out;},
  begin(){
    const s=this.room.set,holes=[...Array(s.holes).keys()],i=Math.max(0,this.slot());
    const pl={name:this.room.players[i].name,col:PLAYER_COLS[i%4],look:this.look(),stats:{pow:6,acc:6,sg:6,putt:6,rec:6,men:6},clubs:{},ball:'STD'};
    busy('LOADING HOLE 1...',()=>startRound({mode:'online',ci:s.ci,holes,weather:WEATHERS[s.weather],diff:1,players:[pl]}));
  },
  // the same wind for everyone in the room on each hole
  wind(){if(!this.room)return;const r=mulberry32((this.room.seed+R.hn*7919)|0),C=R.hole.C,spd=(0.35+0.85*r())*C.wind*R.D.wind*1.7*(R.weather==='STORM'?1.15:1),ang=r()*Math.PI*2;setWind(Math.cos(ang)*spd,Math.sin(ang)*spd);},
  // leaderboard rows for everyone in the room (mine come from my own game, the others from the server)
  rows(rows){
    if(!this.room){return rows;}rows.length=0;
    const pars=R?R.pars:[];
    for(const p of this.room.players){
      if(p.id===this.id&&R&&R.mode==='online'){const q=R.players[0];rows.push({name:p.name,col:p.col,tp:playerToPar(q,R.holes.length),thru:playerThru(q),user:true,pi:0});continue;}
      const sc=p.id===this.id?(this.last?this.last.sc:[]):(p.me?p.me.sc:[]);let tp=0;for(let k=0;k<sc.length&&k<pars.length;k++)tp+=sc[k]-pars[k];
      rows.push({name:p.name,col:p.col,tp,thru:Math.min(sc.length,pars.length),user:p.id===this.id});}
    return rows;
  },
  // has everyone else finished the hole I just finished?
  holeDone(){if(!this.room)return true;for(const p of this.room.players){if(p.id===this.id)continue;if(!p.me||p.me.sc.length<=R.hn)return false;}return true;},
  waiting(){if(!this.room)return 0;let n=0;for(const p of this.room.players){if(p.id===this.id)continue;if(!p.me||p.me.sc.length<=R.hn)n++;}return n;},
  allFinished(){if(!this.room)return true;const n=this.room.set.holes;for(const p of this.room.players){if(p.id===this.id)continue;if(!p.me||p.me.sc.length<n)return false;}return true;},
  // name tags over the rivals (kept clear of the HUD and of each other)
  tags(){
    const placed=[];
    for(const v of this.vis()){const s=v.s,q=w2s(s.gx,s.gy,2.25);if(q[0]<-20||q[0]>W+20||q[1]<0||q[1]>H)continue;
      const lab=v.o.name+'  '+(s.ph===3?'IN':s.st+(s.ph===2?0:1)),w=textW(lab)+10,tx=clamp(q[0]-w/2,2,W-w-2);let yy=clamp(q[1]-13,34,H-60);
      const bad=()=>!hudFree(tx,yy,w,11)||placed.some(p=>tx<p[0]+p[2]+2&&tx+w+2>p[0]&&yy<p[1]+12.5&&yy+12.5>p[1]);
      for(let k=0;k<8&&bad();k++)yy+=13;if(bad())continue;placed.push([tx,yy,w]);tagM(tx,yy,w,lab,v.o.col,'#ffffff',null);}
  }
};
setInterval(()=>{try{Net.pump();}catch(e){console.warn(e);}},200);
// ---------- the ONLINE screen: find or make a room, wait for players, start ----------
SCREENS.online={
  enter(){try{if(!Career.d&&Career.exists())Career.load();}catch(e){}Net.err=Net.err||'';},
  draw(dt,time){
    bgPattern(time);header('PLAY ONLINE',()=>{Net.leave();go('title');});
    const rm=Net.room;
    if(!Net.base()){
      panel(40,36,W-80,120,'NOT SET UP YET');
      ['ONLINE MATCHES NEED A MATCH SERVER ON THE INTERNET.','THE SERVER IS BUILT AND TESTED, BUT IT HAS NOT BEEN','PUT ONLINE YET. ONCE IT IS, THIS SCREEN JUST WORKS.','','ON THE SAME WIFI YOU CAN POINT THE GAME AT A','COMPUTER RUNNING THE SERVER:'].forEach((l,i)=>txt(l,W/2,58+i*11,'#cfd6e6',1,1));
      button(W/2-70,130,140,20,'SERVER ADDRESS',()=>modalInput('MATCH SERVER ADDRESS',OPT.server||'http://',60,v=>{OPT.server=/^https?:\/\/[\w.\-:\[\]]+\/?$/.test(String(v||'').trim())?String(v).trim():'';saveOpts();}),{style:'navy',sc:1,id:'srv'});
      return;
    }
    if(!rm){
      panel(62,32,W-124,150,'FIND A MATCH');
      txt('YOUR GOLFER',W/2,52,'#9fb0d0',1,1);
      button(W/2-70,61,140,18,Net.name(),()=>modalInput('GOLFER NAME',Net.name(),12,v=>{v=String(v||'').toUpperCase().replace(/[^A-Z0-9 ]/g,'').trim().slice(0,12);if(v){OPT.onName=v;saveOpts();}}),{style:'navy',sc:1,id:'onname'});
      button(W/2-94,88,188,24,'QUICK MATCH',()=>Net.join('quick'),{style:'green',dis:Net.joining,id:'onquick',key:'Enter'});
      button(W/2-94,117,92,20,'CREATE ROOM',()=>Net.join('create'),{style:'navy',sc:1,dis:Net.joining,id:'oncreate'});
      button(W/2+2,117,92,20,'JOIN WITH CODE',()=>modalInput('ROOM CODE (4 LETTERS)','',4,v=>{v=String(v||'').toUpperCase().replace(/[^A-Z]/g,'');if(v.length===4)Net.join('join',v);else Net.err='A ROOM CODE IS 4 LETTERS';}),{style:'navy',sc:1,dis:Net.joining,id:'onjoin'});
      txt('2 TO 4 PLAYERS. EVERYONE PLAYS AT THE SAME TIME.',W/2,146,'#9fb0d0',1,1);txt('LOWEST SCORE WINS.',W/2,157,'#9fb0d0',1,1);
      if(Net.info)txt(Net.info,W/2,170,'#ffffff',1,1);else if(Net.err)txt(Net.err,W/2,170,'#ff9a9a',1,1);
      return;
    }
    // in a room
    const host=Net.isHost(),n=rm.players.length;
    panel(8,28,184,128,'PLAYERS '+n+'/'+rm.max);
    rm.players.forEach((p,i)=>{const y=48+i*26,me=p.id===Net.id;
      rect(12,y,176,23,me?'#24386a':'#16244a');ctx.fillStyle=p.col;ctx.beginPath();ctx.arc(24,y+11.5,9.5,0,6.2832);ctx.fill();
      const L=me?Net.look():(p.look&&p.look.skin?p.look:{skin:SKINS[1],hairS:HAIRS[0],hairC:HAIRC[0],shirt:p.col,pants:PANTS[0]});
      if(UIK>1&&R3D.ok)thumbM('on_'+p.id+JSON.stringify(L),L,'head',24,y+11.5,17);
      txt(p.name,40,y+4,'#ffffff');txt(me?'YOU':(p.id===rm.host?'HOST':'READY'),40,y+13,me?COL.gold:'#9fb0d0');
      if(p.id===rm.host&&me)txt('HOST',184,y+8,'#9fb0d0',1,2);});
    for(let i=n;i<rm.max;i++){const y=48+i*26;rect(12,y,176,23,'#101a36');txt('WAITING FOR A PLAYER...',100,y+8,'#5a6a94',1,1);}
    panel(198,28,W-206,128,'THE MATCH');
    txt(rm.pub?'QUICK MATCH ROOM':'ROOM CODE',288,46,'#9fb0d0',1,1);txt(rm.code,288,56,COL.gold,3,1);
    const S=rm.set,row=(y,lab,val,ch)=>{txt(lab,206,y+4,'#9fb0d0');if(host){button(252,y,16,15,'<',()=>ch(-1),{style:'navy',sc:1,id:'on'+lab+'L'});button(356,y,16,15,'>',()=>ch(1),{style:'navy',sc:1,id:'on'+lab+'R'});}txt(val,312,y+4,'#ffffff',1,1);};
    const set=o=>{Net.sendSet={...S,...o};Object.assign(S,o);};
    row(84,'COURSE',COURSES[S.ci].name,d=>set({ci:(S.ci+d+COURSES.length)%COURSES.length}));
    row(102,'HOLES',S.holes+' HOLES',d=>{const a=[3,6,9];set({holes:a[(a.indexOf(S.holes)+d+3)%3]});});
    row(120,'WEATHER',WEATHERS[S.weather],d=>set({weather:(S.weather+d+WEATHERS.length)%WEATHERS.length}));
    if(!host)txt('THE HOST PICKS THE COURSE',288,140,'#5a6a94',1,1);
    button(8,162,90,24,'LEAVE',()=>{Net.leave();},{style:'red',sc:1,id:'onleave'});
    if(host)button(W-168,162,160,24,n<2?'NEED 2 PLAYERS':'START THE MATCH',()=>{Net.sendStart=true;},{style:'green',dis:n<2,key:'Enter',id:'onstart'});
    else txt('WAITING FOR THE HOST TO START...',W-8,170,'#ffffff',1,2);
    txt(rm.pub?'ANYONE WHO PRESSES QUICK MATCH CAN JOIN THIS ROOM':'TELL YOUR FRIENDS THE ROOM CODE: THEY PRESS JOIN WITH CODE',W/2,196,'#9fb0d0',1,1);
  }
};
// ---------- the result of an online match ----------
SCREENS.onresults={
  draw(dt,time){
    bgPattern(time);header('ONLINE MATCH',null);
    const lb=leaderboard(),all=Net.allFinished(),me=lb.find(r=>r.user);
    panel(52,28,W-104,132,all?'FINAL RESULT':'WAITING FOR THE OTHERS TO FINISH');
    lb.forEach((r,i)=>{const y=50+i*24;rect(58,y,W-116,21,r.user?'#24386a':'#16244a');
      txt(posLabel(r),72,y+4,r.pos===1&&all?COL.gold:'#cfd6e6',2,1);ctx.fillStyle=r.col;ctx.beginPath();ctx.arc(96,y+10.5,4,0,6.2832);ctx.fill();
      txt(r.name,106,y+7,r.user?COL.gold:'#ffffff');txt(toPar(r.tp),W-120,y+4,r.tp<0?'#ff7070':r.tp>0?'#8fb8ff':'#ffffff',2,2);
      txt(r.thru>=R.holes.length?'DONE':'THRU '+r.thru,W-64,y+7,'#9fb0d0',1,2);});
    if(all&&me)txt(me.pos===1?(me.tie?'A TIE FOR FIRST!':'YOU WIN!'):'YOU FINISHED '+posLabel(me)+' OF '+lb.length,W/2,166,me.pos===1?COL.gold:'#ffffff',1,1);
    button(8,186,90,24,'LEAVE',()=>{Net.leave();go('title');},{style:'red',sc:1,id:'onleave'});
    if(!Net.room)button(W-168,186,160,24,'MAIN MENU',()=>go('title'),{key:'Enter',id:'onmenu'});
    else if(Net.isHost())button(W-168,186,160,24,'PLAY AGAIN',()=>{Net.sendAgain=true;},{style:'green',dis:!all,key:'Enter',id:'onagain'});
    else txt('THE HOST CAN START ANOTHER MATCH',W-8,194,'#9fb0d0',1,2);
  }
};
